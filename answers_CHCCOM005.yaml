  section: Knowledge Assessment
  question_ref: Table_33
  label: Grammar - Explain why each given factor is important for verbal communication
    in health and communit
  table_idx: 33
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 3F0DD574
  value: It is important to use correct grammar when communicating because grammar
    can change the meaning of a statement. For example, suppose you report a recent
    incident to your supervisor using present tense verbs. In that case, they may
    think it is an incident that is still happening instead of one that has already
    been addressed.
