- field_id: CHCCCS041_TXT_4_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_4
  label: Table 4 Row 3 Col 0
  table_idx: 4
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 210EA7C3
  value: '2. Connective tissue: Supports, binds, and cushions other tissues and organs
    (bones, cartilage, adipose).'
- field_id: CHCCCS041_TXT_4_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_4
  label: Table 4 Row 4 Col 0
  table_idx: 4
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 08F15B0E
  value: '3. Muscle tissue: Generates mechanical force to produce voluntary and involuntary
    bodily movement.'
- field_id: CHCCCS041_TXT_4_5_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_4
  label: Table 4 Row 5 Col 0
  table_idx: 4
  row_idx: 5
  col_idx: 0
  index_in_cell: 0
  para_id: 3E909CEE
  value: '4. Nervous tissue: Transmits electrical and chemical nerve impulses throughout
    the central and peripheral nervous system.'
- field_id: CHCCCS041_TXT_4_6_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_4
  label: Table 4 Row 6 Col 0
  table_idx: 4
  row_idx: 6
  col_idx: 0
  index_in_cell: 0
  para_id: 76124B20
  value: '5. Fluid tissue (blood/lymph): Transports oxygen, nutrients, hormones, and
    immune cells while removing metabolic wastes.'
- field_id: CHCCCS041_TXT_5_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: 'Cardiovascular system - Listed below are different organ systems of the
    human body. Briefly explain '
  table_idx: 5
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 015433B3
  value: 'Cardiovascular system: Circulates oxygenated blood, nutrients, and hormones
    to cells throughout the body while transporting carbon dioxide and wastes to excretory
    organs via heart pumping action.'
- field_id: CHCCCS041_TXT_5_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Respiratory system - Listed below are different organ systems of the human
    body. Briefly explain the
  table_idx: 5
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 7989536E
  value: 'Respiratory system: Facilitates gas exchange by bringing oxygen into the
    body through inhalation and eliminating metabolic carbon dioxide through exhalation.'
- field_id: CHCCCS041_TXT_5_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Musculoskeletal system - Listed below are different organ systems of the
    human body. Briefly explain
  table_idx: 5
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 60190B64
  value: 'Musculoskeletal system: Provides structural framework, protects internal
    organs, produces red blood cells, stores calcium, and enables voluntary locomotion
    through muscle-bone contraction.'
- field_id: CHCCCS041_TXT_5_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Endocrine system - Listed below are different organ systems of the human
    body. Briefly explain the b
  table_idx: 5
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 6AFC89B2
  value: 'Digestive system: Breaks down food mechanically and chemically, absorbs
    essential nutrients, vitamins, and water into the bloodstream, and expels solid
    waste.'
- field_id: CHCCCS041_TXT_5_7_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Digestive system - Listed below are different organ systems of the human
    body. Briefly explain the b
  table_idx: 5
  row_idx: 7
  col_idx: 2
  index_in_cell: 0
  para_id: 4C43FA99
  value: 'Urinary/Renal system: Filters metabolic wastes and toxins from blood, regulates
    systemic fluid and electrolyte balance, and maintains blood pH through urine excretion.'
- field_id: CHCCCS041_TXT_5_8_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Urinary system - Listed below are different organ systems of the human body.
    Briefly explain the bas
  table_idx: 5
  row_idx: 8
  col_idx: 2
  index_in_cell: 0
  para_id: 504A2E23
  value: 'Endocrine system: Synthesizes and secretes chemical messengers (hormones)
    directly into blood to regulate metabolism, growth, mood, and reproduction.'
- field_id: CHCCCS041_TXT_5_9_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Female reproductive system - Listed below are different organ systems of
    the human body. Briefly exp
  table_idx: 5
  row_idx: 9
  col_idx: 2
  index_in_cell: 0
  para_id: 6A9C98AC
  value: Produces female gametes (ova), secretes estrogen and progesterone, facilitates
    fertilization, and supports foetal gestation.
- field_id: CHCCCS041_TXT_6_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Male reproductive system - Function
  table_idx: 6
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 3C60C74C
  value: Produces, maintains, and transports sperm and protective seminal fluid, and
    secretes male sex hormones (testosterone).
- field_id: CHCCCS041_TXT_6_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Integumentary system - Function
  table_idx: 6
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 348C9CD2
  value: Forms a waterproof outer protective barrier against environmental pathogens,
    UV radiation, and dehydration; houses sensory receptors; and regulates body temperature.
- field_id: CHCCCS041_TXT_6_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Lymphatic system - Function
  table_idx: 6
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 431EE44B
  value: Returns leaked interstitial fluid to the circulatory system, absorbs dietary
    fats, and filters foreign pathogens through lymph nodes.
- field_id: CHCCCS041_TXT_6_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Nervous system - Function
  table_idx: 6
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 7C245995
  value: Rapidly detects internal and external sensory stimuli, processes cognitive
    information, and coordinates voluntary and involuntary physiological responses.
- field_id: CHCCCS041_TXT_6_5_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Immune system - Function
  table_idx: 6
  row_idx: 5
  col_idx: 1
  index_in_cell: 0
  para_id: 10CD4A12
  value: Defends the body against infectious microorganisms (bacteria, viruses, fungi)
    and abnormal cells using innate physical barriers and adaptive antibody/cellular
    responses.
- field_id: CHCCCS041_TXT_6_6_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Renal system - Function
  table_idx: 6
  row_idx: 6
  col_idx: 1
  index_in_cell: 0
  para_id: 2448F2E5
  value: Filters metabolic wastes and toxins from blood, regulates systemic fluid
    and electrolyte balance, and maintains blood pH through urine excretion.
- field_id: CHCCCS041_TXT_7_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Eyes - Briefly explain the basic functions of the following sensory organs.
  table_idx: 7
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 7DE9086E
  value: 'Eyes: Photoreceptor organs that detect light waves and transmit electrical
    impulses via the optic nerve to the brain for visual processing.'
- field_id: CHCCCS041_TXT_7_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Include its two main functions.
  table_idx: 7
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 5D843086
  value: 'Ears: Mechanoreceptors that detect acoustic sound waves for hearing and
    fluid movements in semicircular canals to maintain balance and spatial equilibrium.'
- field_id: CHCCCS041_TXT_7_4_2_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Include its two main functions.
  table_idx: 7
  row_idx: 4
  col_idx: 2
  index_in_cell: 1
  para_id: 334677C5
  value: 'Ears: Mechanoreceptors that detect acoustic sound waves for hearing and
    fluid movements in semicircular canals to maintain balance and spatial equilibrium.'
- field_id: CHCCCS041_TXT_7_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Tongue - Briefly explain the basic functions of the following sensory organs.
  table_idx: 7
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 77E84748
  value: 'Nose: Houses olfactory receptors that detect airborne chemical odor molecules
    and filters/warms inhaled air.'
- field_id: CHCCCS041_TXT_7_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Nose - Briefly explain the basic functions of the following sensory organs.
  table_idx: 7
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 401233E7
  value: 'Tongue: Features gustatory papillae taste buds that detect basic chemical
    tastes (sweet, salty, sour, bitter, umami) and assists with mastication and swallowing.'
