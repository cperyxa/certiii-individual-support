- field_id: CHCCCS041_TXT_41_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_41
  label: Ears - Explanation
  table_idx: 41
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 323600D3
