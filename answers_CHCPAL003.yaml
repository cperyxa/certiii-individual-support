- field_id: CHCPAL003_TXT_4_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What does a holistic palliative approach mean?
  table_idx: 4
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 6585A1CB
  value: A holistic palliative approach means a wide-reaching approach. In other words,
    palliative care should not be limited to addressing only the person’s physical
    or medical needs. It must also address the person’s psychological, emotional,
    social, cultural and religious needs.
