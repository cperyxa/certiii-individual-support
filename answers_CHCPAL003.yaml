  section: Knowledge Assessment
  question_ref: Table_13
  label: Anger - Briefly describe each stage of grief stated in the table below.
  table_idx: 13
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 5668FBA9
  value: In this stage, bottled-up emotions in the denial stage come to the surface,
    usually in the form of anger. They demand answers to questions like, ‘What did
    I do to deserve this’ and may also redirect anger to animate or inanimate objects,
    themselves or the person who died.
- field_id: CHCPAL003_TXT_13_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Bargaining - Briefly describe each stage of grief stated in the table below.
  table_idx: 13
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 30E7A3F6
  value: In this stage, the bereaved tend to imagine ‘what if’ scenarios, playing
    out the possible interventions they could have done to prevent death due to intense
    guilt. They also tend to negotiate with a higher being to spare their loved ones.
- field_id: CHCPAL003_TXT_13_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Depression - Briefly describe each stage of grief stated in the table below.
  table_idx: 13
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 05B4E4EA
  value: In this stage, the bereaved is withdrawn due to feelings of emptiness. These
    manifest in ways like loss of interest in eating or activities usually enjoyed,
    reduced interaction with others, lethargy, etc.
- field_id: CHCPAL003_TXT_13_7_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Acceptance - Briefly describe each stage of grief stated in the table below.
  table_idx: 13
  row_idx: 7
  col_idx: 2
  index_in_cell: 0
  para_id: 357DB828
  value: In this stage, emotions of the bereaved start to stabilise as they begin
    to accept the reality of loss. They may not be entirely alright with it, but they
    begin to make an effort to build their lives again and adjust to a life without
    the person who died.
