  type: text
  section: Practical Assessment
  question_ref: Table_106
  label: How I will implement this according to my job role
  table_idx: 106
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 4BCA210D
  value: Support oral comfort care and mouth hygiene rather than artificial feeding,
    ensuring the client is comfortable and moistening lips as per care plan.
- field_id: CHCPAL003_TXT_108_1_0_1
  type: text
  section: Practical Assessment
  question_ref: Table_108
  label: ACD
  table_idx: 108
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 56D02E76
  value: Refusal of Cardiopulmonary Resuscitation (CPR / DNR)
- field_id: CHCPAL003_TXT_108_1_1_1
  type: text
  section: Practical Assessment
  question_ref: Table_108
  label: Relevant legislative requirement
  table_idx: 108
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 1D45A222
  value: 'Guardianship Act 1987 (NSW) / Advance Care Directives Common Law: A valid
    advance care directive refusing medical treatment is legally binding and must
    be respected by care staff.'
- field_id: CHCPAL003_TXT_108_1_2_1
  type: text
  section: Practical Assessment
  question_ref: Table_108
  label: How I will implement this according to the legislative requirements
  table_idx: 108
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 0B934EBF
  value: Adhere to the client's legally binding refusal of life-sustaining treatment
    by not initiating CPR and immediately alerting the supervising registered nurse.
- field_id: CHCPAL003_TXT_108_2_0_1
  type: text
  section: Practical Assessment
  question_ref: Table_108
  label: ACD
  table_idx: 108
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 22A3EE97
  value: Refusal of artificial nutrition and hydration via tube feeding
- field_id: CHCPAL003_TXT_108_2_1_1
  type: text
  section: Practical Assessment
  question_ref: Table_108
  label: Relevant legislative requirement
  table_idx: 108
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 5ED0DF52
  value: 'Consent to Medical and Dental Treatment (Guardianship Act 1987 NSW): Competent
    adults have the right to refuse medical interventions including artificial nutrition.'
- field_id: CHCPAL003_TXT_108_2_2_1
  type: text
  section: Practical Assessment
  question_ref: Table_108
  label: How I will implement this according to the legislative requirements
  table_idx: 108
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 0604E888
  value: Comply with the client's refusal of invasive artificial nutrition while continuing
    to offer palliative comfort measures and oral hydration.
