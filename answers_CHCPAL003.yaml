- field_id: CHCPAL003_TXT_39_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Work role boundaries - Legal consideration
  table_idx: 39
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 1C11F271
  value: Aged care workers must be careful when performing physical steps (i.e. care
    processes involving touching the person) to prevent cases of harassment.
- field_id: CHCPAL003_TXT_39_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Work role boundaries - Ethical consideration
  table_idx: 39
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: '37243581'
  value: An aged care worker must develop and maintain professional relationships
    with their clients, which means not getting too involved with their client’s personal
    lives (e.g. finances)
- field_id: CHCPAL003_TXT_39_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Work role responsibilities - Legal consideration
  table_idx: 39
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 0B116859
  value: Aged care workers must provide close supervision to their clients, following
    their organisation’s duty of care protocols.
- field_id: CHCPAL003_TXT_39_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Work role responsibilities - Ethical consideration
  table_idx: 39
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 73FC5D46
  value: Aged care workers must respect and consider their client’s decisions by allowing
    them to experience an acceptable level of risk.
- field_id: CHCPAL003_TXT_39_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Work role limitations - Legal consideration
  table_idx: 39
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 7AEF89DE
  value: Aged care workers must acquire permission or consent first before applying
    restrictive practices.
- field_id: CHCPAL003_TXT_39_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Work role limitations - Ethical consideration
  table_idx: 39
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 6C6BB776
  value: Aged care workers must not share false information or unfounded assumptions
    to their clients, such as making a medical diagnosis that a health specialist
    can only do.
