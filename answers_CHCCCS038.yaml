- field_id: CHCCCS038_TXT_7_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_7
  label: Social - Briefly describe how structural and systemic power can become obstacles
    to empowerment in e
  table_idx: 7
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 5A1F03D7
  value: 'Health and community services: Rigid provider schedules can override individual
    preferences, dictating when clients wake, eat, and shower.'
- field_id: CHCCCS038_TXT_7_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_7
  label: Physical - Briefly describe how structural and systemic power can become
    obstacles to empowerment in
  table_idx: 7
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 5552F2D7
  value: 'Education and employment: Systemic entry barriers and inflexible workplaces
    exclude people with disability from career progression.'
- field_id: CHCCCS038_TXT_7_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_7
  label: Emotional - Briefly describe how structural and systemic power can become
    obstacles to empowerment i
  table_idx: 7
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 4A78971D
  value: 'Housing and accommodation: Lack of accessible social housing forces individuals
    into restrictive group homes or residential care.'
- field_id: CHCCCS038_TXT_7_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_7
  label: Stigma - Briefly describe how structural and systemic power can become obstacles
    to empowerment in e
  table_idx: 7
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 0A515393
  value: 'Legal and justice systems: Complex legal language and lack of communication
    supports deny marginalized individuals equal standing.'
- field_id: CHCCCS038_TXT_7_7_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_7
  label: Ageism - Briefly describe how structural and systemic power can become obstacles
    to empowerment in e
  table_idx: 7
  row_idx: 7
  col_idx: 2
  index_in_cell: 0
  para_id: 7EF062E1
  value: 'Financial services: Strict banking criteria and risk models restrict independent
    management of personal finances.'
- field_id: CHCCCS038_TXT_7_8_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_7
  label: Cultural - Briefly describe how structural and systemic power can become
    obstacles to empowerment in
  table_idx: 7
  row_idx: 8
  col_idx: 2
  index_in_cell: 0
  para_id: 7931B400
  value: 'Public transport and infrastructure: Inaccessible buses, trains, and urban
    footpaths severely restrict independent mobility.'
- field_id: CHCCCS038_TXT_7_9_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_7
  label: Economic - Briefly describe how structural and systemic power can become
    obstacles to empowerment in
  table_idx: 7
  row_idx: 9
  col_idx: 2
  index_in_cell: 0
  para_id: 3B4CF8E3
  value: 'Social and civic participation: Physical and attitudinal barriers exclude
    individuals from voting, volunteering, and community governance.'
- field_id: CHCCCS038_TXT_8_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Describe a social construct of ageing from the perspective of older people.
  table_idx: 8
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 1CEC756D
  value: Older people often construct ageing as a natural life stage characterized
    by wisdom, continued personal growth, resilience, and valuable life experience,
    while seeking continued dignity and autonomy.
- field_id: CHCCCS038_TXT_8_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Describe a social construct of ageing from the perspective of younger people.
  table_idx: 8
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 1329FE71
  value: Younger people often view ageing through an ageist deficit lens, associating
    it primarily with physical decay, cognitive decline, burden, and technological
    irrelevance.
- field_id: CHCCCS038_TXT_8_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Describe the social construct of disability based on the medical model.
  table_idx: 8
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 00B750C6
  value: The medical model views disability as an individual physical or psychological
    pathology or defect that resides within the person and must be cured or medically
    managed by experts.
- field_id: CHCCCS038_TXT_8_5_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Describe disability based on the social model.
  table_idx: 8
  row_idx: 5
  col_idx: 0
  index_in_cell: 0
  para_id: 7F64D4D7
  value: The social model views disability as the result of physical, systemic, and
    attitudinal barriers created by society, which disadvantage and exclude people
    with impairments.
- field_id: CHCCCS038_TXT_9_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Complete the table
  label: How do you feel about working with people with disabilities? Explain your
    answer briefly.
  table_idx: 9
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 6CB3BA43
  value: I feel passionate and deeply committed to working collaboratively with people
    with disabilities, viewing them as equal rights-holders who possess distinct strengths,
    goals, and rights to full self-determination.
- field_id: CHCCCS038_TXT_9_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Complete the table
  label: 'Complete the table by:

    Identifying two examples of your personal attitudes towards people with disab'
  table_idx: 9
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 757532CA
  value: '1. Positive attitude: Believing every individual has inherent worth and
    capacity for lifelong learning and growth.'
- field_id: CHCCCS038_TXT_9_1_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Complete the table
  label: 'Complete the table by:

    Identifying two examples of your personal attitudes towards people with disab'
  table_idx: 9
  row_idx: 1
  col_idx: 0
  index_in_cell: 1
  para_id: 2C2A5F08
  value: 'Impact: Encourages proactive support that promotes independence, active
    support, and dignity of risk.'
- field_id: CHCCCS038_TXT_9_1_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Complete the table
  label: 'Complete the table by:

    Identifying two examples of your personal attitudes towards people with disab'
  table_idx: 9
  row_idx: 1
  col_idx: 0
  index_in_cell: 2
  para_id: 571DD5FA
  value: '2. Unconscious paternalism: Feeling an instinct to protect or do things
    for the person to save time or avoid struggle.'
- field_id: CHCCCS038_TXT_9_1_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Complete the table
  label: 'Complete the table by:

    Identifying two examples of your personal attitudes towards people with disab'
  table_idx: 9
  row_idx: 1
  col_idx: 0
  index_in_cell: 3
  para_id: 2EA6C30B
  value: 'Impact: Risks disempowering the client; must be actively managed by stepping
    back and providing graded guidance.'
- field_id: CHCCCS038_TXT_10_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Describe a staff who is more experienced than a care worker.
  table_idx: 10
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 7B1C5D1B
  value: An experienced staff member possesses extensive practical on-the-job history,
    seasoned situational judgment, and deep practical problem-solving skills developed
    over years of client support.
- field_id: CHCCCS038_TXT_10_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Describe a staff who is a more qualified than a care worker.
  table_idx: 10
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 293D72F1
  value: A qualified staff member holds recognized formal tertiary or vocational credentials
    (e.g. Registered Nurse, Occupational Therapist, Behaviour Support Practitioner)
    granting clinical and legal authority.
- field_id: CHCCCS038_TXT_10_4_0_1
