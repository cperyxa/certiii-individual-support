- field_id: CHCCCS038_TXT_18_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Explain what restrictive practices are according to the Australian Law Reform
    Commission.
  table_idx: 18
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 63A0495E
  value: Restrictive practices are actions or equipment that stop a person from moving
    freely or doing what they want, used only as a last resort to keep them or others
    safe after positive support strategies have been tried.
- field_id: CHCCCS038_TXT_18_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Briefly explain why authorised restrictive practices must only be used as
    a last resort.
  table_idx: 18
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 75F53565
  value: Authorised restrictive practices must only be used as a last resort to prevent
    serious harm after trying positive behaviour support strategies.
- field_id: CHCCCS038_TXT_18_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify the five forms of restrictive practices.
  table_idx: 18
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 4361B572
  value: 'Chemical restraint: Using medication for the primary purpose of controlling
    behaviour.'
- field_id: CHCCCS038_TXT_18_4_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify the five forms of restrictive practices.
  table_idx: 18
  row_idx: 4
  col_idx: 0
  index_in_cell: 1
  para_id: 167ABEA4
  value: 'Mechanical restraint: Using devices or straps to restrict free movement
    of the body.'
- field_id: CHCCCS038_TXT_18_4_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify the five forms of restrictive practices.
  table_idx: 18
  row_idx: 4
  col_idx: 0
  index_in_cell: 2
  para_id: 7DF06673
  value: 'Physical restraint: Using hands or physical force to hold or restrict movement.'
- field_id: CHCCCS038_TXT_18_4_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify the five forms of restrictive practices.
  table_idx: 18
  row_idx: 4
  col_idx: 0
  index_in_cell: 3
  para_id: 0A9757EB
  value: 'Environmental restraint: Locking doors or restricting access to parts of
    the home or personal belongings.'
- field_id: CHCCCS038_TXT_18_4_0_5
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify the five forms of restrictive practices.
  table_idx: 18
  row_idx: 4
  col_idx: 0
  index_in_cell: 4
  para_id: 6B149BE0
  value: 'Seclusion: Keeping someone alone in a room that they are not free to leave.'
