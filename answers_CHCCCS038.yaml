- field_id: CHCCCS038_TXT_4_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_4
  label: Enablement versus Reablement
  table_idx: 4
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 6665D64E
  value: Enablement is a collaborative approach that assists individuals to do things
    for themselves to maintain autonomy, while reablement focuses on intensive, time-limited
    interventions to regain lost physical and social skills following an acute illness
    or injury.
- field_id: CHCCCS038_TXT_4_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_4
  label: Institutionalised versus person-centred, self-directed model of support
  table_idx: 4
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 5971F53B
  value: An institutional model enforces uniform schedules, medical routines, and
    provider dominance, treating individuals as passive care recipients.
- field_id: CHCCCS038_TXT_5_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Complete the table
  label: Attitudinal barriers - Listed below are different types of individual, emotional
    and environmental b
  table_idx: 5
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 0303C732
  value: 'Individual barrier: Low self-confidence or internalized defeatism resulting
    from prolonged dependency on care providers.'
- field_id: CHCCCS038_TXT_5_3_3_1
  type: text
  section: Knowledge Assessment
  question_ref: Complete the table
  label: Attitudinal barriers - Listed below are different types of individual, emotional
    and environmental b
  table_idx: 5
  row_idx: 3
  col_idx: 3
  index_in_cell: 0
  para_id: 42FD6FC1
  value: 'Strategy: Utilize positive reinforcement and incremental skill-building
    to celebrate small achievements and foster self-efficacy.'
- field_id: CHCCCS038_TXT_5_4_2_1
