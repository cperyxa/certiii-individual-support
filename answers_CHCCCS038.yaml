  label: Identify two situations where a care worker must seek support from a more
    experienced or qualified s
  table_idx: 10
  row_idx: 5
  col_idx: 0
  index_in_cell: 0
  para_id: 5479190F
  value: 1. When a client exhibits acute physical deterioration, unmanaged pain, or
    signs of a serious medical emergency.
- field_id: CHCCCS038_TXT_10_5_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify two situations where a care worker must seek support from a more
    experienced or qualified s
  table_idx: 10
  row_idx: 5
  col_idx: 0
  index_in_cell: 1
  para_id: 11F2BA9B
  value: 2. When encountering complex behaviours of concern or suspected abuse that
    exceed the worker's training and scope of practice.
- field_id: CHCCCS038_TXT_11_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: 'Attention Deficit Hyperactivity Disorder (ADHD) - Identify two support practices
    for each condition '
  table_idx: 11
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 55564ACB
  value: 'Sensory disability (Vision loss): Verbally describe surroundings, announce
    entrances/exits, and ensure hallways are well-lit and clear of obstacles.'
- field_id: CHCCCS038_TXT_11_3_2_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: 'Attention Deficit Hyperactivity Disorder (ADHD) - Identify two support practices
    for each condition '
  table_idx: 11
  row_idx: 3
  col_idx: 2
  index_in_cell: 1
  para_id: 6A802C14
  value: 'Sensory disability (Hearing loss): Maintain clear face-to-face eye contact,
    speak clearly without shouting, and utilize hearing loop systems or visual communication
    aids.'
- field_id: CHCCCS038_TXT_11_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Sickle Cell Disease - Identify two support practices for each condition provided
    in the table below.
  table_idx: 11
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 5FBBEEB5
  value: 'Intellectual disability: Break instructions down into simple, concrete steps,
    use visual prompt cards, and allow ample time for responses.'
- field_id: CHCCCS038_TXT_11_4_2_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Sickle Cell Disease - Identify two support practices for each condition provided
    in the table below.
  table_idx: 11
  row_idx: 4
  col_idx: 2
  index_in_cell: 1
  para_id: 7E54744C
  value: 'Intellectual disability: Implement active support techniques to engage the
    person in everyday tasks using consistent routines and positive reinforcement.'
- field_id: CHCCCS038_TXT_11_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Physical Trauma - Identify two support practices for each condition provided
    in the table below.
  table_idx: 11
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 79A087DB
  value: 'Physical disability (Mobility impairment): Ensure ergonomic physical access,
    position transfer equipment correctly, and support client to use adaptive cutlery/aids.'
- field_id: CHCCCS038_TXT_11_5_2_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Physical Trauma - Identify two support practices for each condition provided
    in the table below.
  table_idx: 11
  row_idx: 5
  col_idx: 2
  index_in_cell: 1
  para_id: 1E88CFBA
  value: 'Physical disability (Cerebral palsy): Encourage comfortable positioning,
    allow extra time for speech, and collaborate with speech/physiotherapy directives.'
- field_id: CHCCCS038_TXT_11_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Psychological Trauma - Identify two support practices for each condition
    provided in the table below
  table_idx: 11
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 1A2457CB
  value: 'Acquired brain injury: Maintain a predictable, calm daily schedule, use
    written checklist organizers, and avoid over-stimulating environments.'
- field_id: CHCCCS038_TXT_11_6_2_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Psychological Trauma - Identify two support practices for each condition
    provided in the table below
  table_idx: 11
  row_idx: 6
  col_idx: 2
  index_in_cell: 1
  para_id: 2472CA05
  value: 'Acquired brain injury: Use gentle verbal cues for redirection and support
    memory through digital calendar reminders.'
- field_id: CHCCCS038_TXT_11_7_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Arthritis - Identify two support practices for each condition provided in
    the table below.
  table_idx: 11
  row_idx: 7
  col_idx: 2
  index_in_cell: 0
  para_id: 433FCB47
  value: 'Mental health condition (Depression): Provide empathetic, non-judgmental
    active listening and support engagement in small, meaningful social activities.'
- field_id: CHCCCS038_TXT_11_7_2_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Arthritis - Identify two support practices for each condition provided in
    the table below.
  table_idx: 11
  row_idx: 7
  col_idx: 2
  index_in_cell: 1
  para_id: 54CBCC5F
  value: 'Mental health condition (Anxiety): Implement grounding and relaxation strategies,
    validate feelings, and maintain a quiet, predictable atmosphere.'
- field_id: CHCCCS038_TXT_11_8_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Asthma - Identify two support practices for each condition provided in the
    table below.
  table_idx: 11
  row_idx: 8
  col_idx: 2
  index_in_cell: 0
  para_id: 3C866387
  value: 'Dementia (Cognitive decline): Use reminiscence therapy, validate emotional
    reality rather than arguing, and provide clear environmental signage.'
- field_id: CHCCCS038_TXT_11_8_2_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Asthma - Identify two support practices for each condition provided in the
    table below.
  table_idx: 11
  row_idx: 8
  col_idx: 2
  index_in_cell: 1
  para_id: 09DD1A5A
  value: 'Dementia (Wandering risk): Facilitate purposeful movement within secure,
    pleasant garden spaces and maintain familiar comforting objects.'
- field_id: CHCCCS038_TXT_11_9_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Acquired Brain Injury - Identify two support practices for each condition
    provided in the table belo
  table_idx: 11
  row_idx: 9
  col_idx: 2
  index_in_cell: 0
  para_id: 423D8FF8
  value: 'Autism spectrum condition: Respect sensory sensitivities (lighting, noise),
    provide clear advance notice of routine changes, and use structured visual timetables.'
- field_id: CHCCCS038_TXT_11_9_2_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Acquired Brain Injury - Identify two support practices for each condition
    provided in the table belo
  table_idx: 11
  row_idx: 9
  col_idx: 2
  index_in_cell: 1
  para_id: 38F2FAD7
  value: 'Autism spectrum condition: Support special interests and accommodate preferred
    communication styles without forcing direct eye contact.'
- field_id: CHCCCS038_TXT_12_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What is empowerment?
  table_idx: 12
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 0E5475B2
  value: Empowerment is the process of enabling individuals to gain greater control,
    choice, and influence over decisions, actions, and services that affect their
    lives.
- field_id: CHCCCS038_TXT_12_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Briefly describe the four principles of empowerment for people receiving
    support.
  table_idx: 12
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 0218D597
  value: '1. Self-determination: Recognizing the individual as the rightful director
    of their own choices and goals.'
- field_id: CHCCCS038_TXT_12_3_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Briefly describe the four principles of empowerment for people receiving
    support.
  table_idx: 12
  row_idx: 3
  col_idx: 0
  index_in_cell: 1
  para_id: 71F44827
  value: '2. Capacity building: Equipping the person with information, skills, and
    tools to advocate for themselves.'
- field_id: CHCCCS038_TXT_12_3_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Briefly describe the four principles of empowerment for people receiving
    support.
  table_idx: 12
  row_idx: 3
  col_idx: 0
  index_in_cell: 2
  para_id: 1E1AB21F
  value: '3. Participation: Ensuring active inclusion in planning, community life,
    and policy feedback.'
- field_id: CHCCCS038_TXT_12_3_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Briefly describe the four principles of empowerment for people receiving
    support.
  table_idx: 12
  row_idx: 3
  col_idx: 0
  index_in_cell: 3
  para_id: 7E36CEDD
  value: '4. Equality and dignity: Treating the person with respect, removing attitudinal
    barriers, and upholding dignity of risk.'
- field_id: CHCCCS038_TXT_12_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Describe the principle of rights-based approaches.
  table_idx: 12
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: '51046938'
  value: A rights-based approach integrates international human rights principles
    into everyday service delivery, viewing clients as entitlement holders rather
    than objects of charity.
- field_id: CHCCCS038_TXT_13_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the rights-based or human rights approach.
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: '31302552'
  value: '1. Participation: Everyone has the right to participate in decisions that
    affect their lives.'
- field_id: CHCCCS038_TXT_13_0_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the rights-based or human rights approach.
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 1
  para_id: 734406F9
  value: '2. Accountability: Providers and governments must be answerable for the
    realization of rights.'
- field_id: CHCCCS038_TXT_13_0_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the rights-based or human rights approach.
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 2
  para_id: 55B0F39D
  value: '3. Non-discrimination: Equal treatment without distinction based on disability,
    age, or background.'
- field_id: CHCCCS038_TXT_13_0_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the rights-based or human rights approach.
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 3
  para_id: 7080C2AA
  value: '4. Empowerment: People must be supported to claim their rights independently.'
- field_id: CHCCCS038_TXT_13_0_0_5
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the rights-based or human rights approach.
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 4
  para_id: 3D227DE6
  value: '5. Legality: Care practices must comply with statutory human rights frameworks.'
- field_id: CHCCCS038_TXT_13_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify three rights of disabled persons based on the Australian Human Rights
    Commission Act 1986 D
  table_idx: 13
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 2DEF8554
  value: 1. Right to equality before the law and non-discrimination.
- field_id: CHCCCS038_TXT_13_1_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify three rights of disabled persons based on the Australian Human Rights
    Commission Act 1986 D
  table_idx: 13
  row_idx: 1
  col_idx: 0
  index_in_cell: 1
  para_id: 0B02A3C7
  value: 2. Right to personal liberty, security, and freedom from torture or degrading
    treatment.
- field_id: CHCCCS038_TXT_13_1_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify three rights of disabled persons based on the Australian Human Rights
    Commission Act 1986 D
  table_idx: 13
  row_idx: 1
  col_idx: 0
  index_in_cell: 2
  para_id: '35146011'
  value: 3. Right to live independently and be included in the community.
- field_id: CHCCCS038_TXT_13_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify two rights of the child based on the Australian Human Rights Commission
    Act 1986 Declaratio
  table_idx: 13
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 452EE36B
  value: 1. Right to protection from all forms of physical or mental violence, injury,
    or neglect.
- field_id: CHCCCS038_TXT_13_2_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify two rights of the child based on the Australian Human Rights Commission
    Act 1986 Declaratio
  table_idx: 13
  row_idx: 2
  col_idx: 0
  index_in_cell: 1
  para_id: 2988DD7A
  value: 2. Right to participate and have their views given due weight in all matters
    affecting them.
- field_id: CHCCCS038_TXT_13_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify five rights of older persons based on the Charter of Aged Care Rights.
  table_idx: 13
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 22CB6D40
  value: 1. Safe and high-quality care and services.
- field_id: CHCCCS038_TXT_13_3_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify five rights of older persons based on the Charter of Aged Care Rights.
  table_idx: 13
  row_idx: 3
  col_idx: 0
  index_in_cell: 1
  para_id: 712AF721
  value: 2. Be treated with dignity and respect.
- field_id: CHCCCS038_TXT_13_3_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify five rights of older persons based on the Charter of Aged Care Rights.
  table_idx: 13
  row_idx: 3
  col_idx: 0
  index_in_cell: 2
  para_id: 1857A6C0
  value: 3. Have my identity, culture and diversity valued and supported.
- field_id: CHCCCS038_TXT_13_3_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify five rights of older persons based on the Charter of Aged Care Rights.
  table_idx: 13
  row_idx: 3
  col_idx: 0
  index_in_cell: 3
  para_id: 33016ECD
  value: 4. Live without abuse and neglect.
- field_id: CHCCCS038_TXT_13_3_0_5
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify five rights of older persons based on the Charter of Aged Care Rights.
  table_idx: 13
  row_idx: 3
  col_idx: 0
  index_in_cell: 4
  para_id: 0D5D83A3
  value: 5. Exercise choice and make decisions about my care, including personal relationships
    and financial affairs.
- field_id: CHCCCS038_TXT_14_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Briefly explain person-centred practices.
  table_idx: 14
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 056EBFA7
  value: Person-centred practice is an approach where the individual leads the planning
    and delivery of their own support, ensuring their goals, preferences, and rights
    direct every aspect of care.
- field_id: CHCCCS038_TXT_14_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the person-centred approach.
  table_idx: 14
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 15AB880D
  value: 1. Knowing the person deeply (biography, values, relationships).
- field_id: CHCCCS038_TXT_14_1_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the person-centred approach.
  table_idx: 14
  row_idx: 1
  col_idx: 0
  index_in_cell: 1
  para_id: 708F2A72
  value: 2. Fostering genuine partnership and collaboration.
- field_id: CHCCCS038_TXT_14_1_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the person-centred approach.
  table_idx: 14
  row_idx: 1
  col_idx: 0
  index_in_cell: 2
  para_id: 3F5C3B72
  value: 3. Respecting autonomy and dignity of risk.
- field_id: CHCCCS038_TXT_14_1_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the person-centred approach.
  table_idx: 14
  row_idx: 1
  col_idx: 0
  index_in_cell: 3
  para_id: 50614AC5
  value: 4. Recognizing and utilizing existing strengths and capabilities.
- field_id: CHCCCS038_TXT_14_1_0_5
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the five principles of the person-centred approach.
  table_idx: 14
  row_idx: 1
  col_idx: 0
  index_in_cell: 4
  para_id: 268B1A34
  value: 5. Continuous communication, responsiveness, and flexibility.
- field_id: CHCCCS038_TXT_14_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: What are the two important considerations that need to be upheld when delivering
    person-centred serv
  table_idx: 14
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 174975F9
  value: 1. Ensuring that the individual's informed consent is sought and respected.
- field_id: CHCCCS038_TXT_14_2_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: What are the two important considerations that need to be upheld when delivering
    person-centred serv
  table_idx: 14
  row_idx: 2
  col_idx: 0
  index_in_cell: 1
  para_id: 14BFE5EE
  value: 2. Maintaining confidentiality and upholding privacy rights throughout all
    interactions.
- field_id: CHCCCS038_TXT_14_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: What is self-advocacy?
  table_idx: 14
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 4C4A59E3
  value: Self-advocacy is the ability of an individual to effectively speak up, negotiate,
    and assert their own rights, choices, and interests without relying on an intermediary.
- field_id: CHCCCS038_TXT_14_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: List two activities that promote the self-advocacy of people receiving support.
  table_idx: 14
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 027263CA
  value: 1. Facilitating participation in independent self-advocacy peer groups and
    workshops.
- field_id: CHCCCS038_TXT_14_4_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: List two activities that promote the self-advocacy of people receiving support.
  table_idx: 14
  row_idx: 4
  col_idx: 0
  index_in_cell: 1
  para_id: 075E4933
  value: 2. Providing accessible information and coaching clients to express their
    preferences at care planning meetings.
- field_id: CHCCCS038_TXT_15_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_15
  label: Briefly describe the four principles of active support.
  table_idx: 15
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 5AF98239
  value: '1. Every moment has potential: Turning ordinary daily routines into opportunities
    for learning and engagement.'
- field_id: CHCCCS038_TXT_15_0_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Table_15
  label: Briefly describe the four principles of active support.
  table_idx: 15
  row_idx: 0
  col_idx: 0
  index_in_cell: 1
  para_id: 417F6909
  value: '2. Little and often: Breaking tasks down so the person participates frequently
    across the day.'
- field_id: CHCCCS038_TXT_15_0_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Table_15
  label: Briefly describe the four principles of active support.
  table_idx: 15
  row_idx: 0
  col_idx: 0
  index_in_cell: 2
  para_id: 62B4F62C
  value: '3. Graded assistance: Providing precisely the right level of prompting and
    physical support.'
- field_id: CHCCCS038_TXT_15_0_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Table_15
  label: Briefly describe the four principles of active support.
  table_idx: 15
  row_idx: 0
  col_idx: 0
  index_in_cell: 3
  para_id: 1F35CD03
  value: '4. Maximising choice and control: Offering ongoing, meaningful choices during
    activities.'
- field_id: CHCCCS038_TXT_15_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_15
  label: Describe active listening by listing one example of how to demonstrate each
    principle listed below.
  table_idx: 15
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 249B7D1D
  value: '1. Attentive non-verbal cues: Maintaining open body posture, nodding, and
    gentle eye contact.'
- field_id: CHCCCS038_TXT_15_1_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Table_15
  label: Describe active listening by listing one example of how to demonstrate each
    principle listed below.
  table_idx: 15
  row_idx: 1
  col_idx: 0
  index_in_cell: 1
  para_id: 50C6D496
  value: '2. Paraphrasing and reflecting: Summarizing what the client expressed in
    your own words to verify understanding.'
- field_id: CHCCCS038_TXT_15_1_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Table_15
  label: Describe active listening by listing one example of how to demonstrate each
    principle listed below.
  table_idx: 15
  row_idx: 1
  col_idx: 0
  index_in_cell: 2
  para_id: '17066895'
  value: '3. Empathetic validation: Acknowledging and validating the person''s emotions
    without judging or dismissing them.'
- field_id: CHCCCS038_TXT_16_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_16
  label: What is social justice?
  table_idx: 16
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 75A48558
  value: Social justice is the fair and equitable distribution of resources, opportunities,
    rights, and privileges within a society.
- field_id: CHCCCS038_TXT_16_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_16
  label: Briefly describe what a person can obtain from each of the four principles
    of social justice.
  table_idx: 16
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 2B57CF09
  value: '1. Access: Fair and equal opportunity to access health services, education,
    transport, and community infrastructure.'
- field_id: CHCCCS038_TXT_16_1_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Table_16
  label: Briefly describe what a person can obtain from each of the four principles
    of social justice.
  table_idx: 16
  row_idx: 1
  col_idx: 0
  index_in_cell: 1
  para_id: 3D24EE63
  value: '2. Equity: Additional resources and personalized support allocated to overcome
    disadvantage.'
- field_id: CHCCCS038_TXT_16_1_0_3
  type: text
