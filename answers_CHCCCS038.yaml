- field_id: CHCCCS038_TXT_6_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What is structural power?
  table_idx: 6
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 51DC45F8
  value: Structural power refers to the formal institutional hierarchies, legal frameworks,
    and organizational rules that dictate how resources, privileges, and authority
    are distributed across a system.
- field_id: CHCCCS038_TXT_6_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What is systemic power?
  table_idx: 6
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 32A73A4F
  value: Systemic power is the pervasive, entrenched set of cultural norms, policies,
    and societal practices that systematically advantage certain dominant social groups
    while marginalizing others.
- field_id: CHCCCS038_TXT_6_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What are the four factors that affect a society or organisation's structural
    and systemic power?
  table_idx: 6
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 285C7FDD
  value: 1. Legislative and regulatory policies established by government.
- field_id: CHCCCS038_TXT_6_4_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What are the four factors that affect a society or organisation's structural
    and systemic power?
  table_idx: 6
  row_idx: 4
  col_idx: 0
  index_in_cell: 1
  para_id: 7FA21846
  value: 2. Economic resource allocation and funding distribution models.
- field_id: CHCCCS038_TXT_6_4_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What are the four factors that affect a society or organisation's structural
    and systemic power?
  table_idx: 6
  row_idx: 4
  col_idx: 0
  index_in_cell: 2
  para_id: 088A3137
  value: 3. Institutional leadership structures and professional hierarchies.
- field_id: CHCCCS038_TXT_6_4_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What are the four factors that affect a society or organisation's structural
    and systemic power?
  table_idx: 6
  row_idx: 4
  col_idx: 0
  index_in_cell: 3
  para_id: 64479BF3
  value: 4. Societal culture, historical traditions, and prevailing media narratives.
