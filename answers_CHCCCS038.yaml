  section: Knowledge Assessment
  question_ref: Table_37
  label: Three work role boundaries of individual support workers
  table_idx: 37
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 3B3179CC
  value: 'Three work boundaries: 1. Never accept gifts of money or lend money to clients.
    2. Keep relationships strictly professional (not friends outside of work). 3.
    Only do tasks I have been trained and certified to perform.'
