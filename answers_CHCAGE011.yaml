- field_id: CHCAGE011_TXT_27_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Verbal communication - Description
  table_idx: 27
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 4CFC82E3
  value: Speak clearly, use simple everyday words, and give one instruction at a time.
- field_id: CHCAGE011_TXT_27_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Verbal communication - One example
  table_idx: 27
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 4B542B06
  value: 'Example: ''Good morning, Madge. Let''s put on your warm cardigan.'''
- field_id: CHCAGE011_TXT_27_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Non-verbal communication - Description
  table_idx: 27
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 0FE14E42
  value: Use warm eye contact, smile, and keep an open, relaxed posture.
- field_id: CHCAGE011_TXT_27_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Non-verbal communication - One example
  table_idx: 27
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 5183FCF6
  value: 'Example: Sitting down beside the resident so you are at eye level and smiling warmly.'
- field_id: CHCAGE011_TXT_27_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Culturally sensitive communication - Description
  table_idx: 27
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 1A681308
  value: Respecting the person's cultural customs, language preferences, and traditions.
- field_id: CHCAGE011_TXT_27_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Culturally sensitive communication - One example
  table_idx: 27
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 25AED88C
  value: 'Example: Using preferred greetings or simple words in the resident''s first language.'
- field_id: CHCAGE011_TXT_27_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Culturally safe communication - Description
  table_idx: 27
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 69FD9121
  value: Creating a comfortable space where the person feels safe and valued.
- field_id: CHCAGE011_TXT_27_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Culturally safe communication - One example
  table_idx: 27
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 3FB57BD3
  value: 'Example: Arranging a bilingual worker or interpreter if the resident prefers their native tongue.'
- field_id: CHCAGE011_TXT_27_5_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Reality orientation - Description
  table_idx: 27
  row_idx: 5
  col_idx: 1
  index_in_cell: 0
  para_id: 56F799A3
  value: Using gentle environment cues like large clocks and calendars to help orientate without arguing.
- field_id: CHCAGE011_TXT_27_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Reality orientation - One example
  table_idx: 27
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 3D99250A
  value: 'Example: Placing a large-print day/night clock on the bedside table.'
- field_id: CHCAGE011_TXT_27_6_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Reassuring words and phrases - Description
  table_idx: 27
  row_idx: 6
  col_idx: 1
  index_in_cell: 0
  para_id: 6466FFE8
  value: Using comforting, reassuring words to make the person feel safe.
- field_id: CHCAGE011_TXT_27_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Reassuring words and phrases - One example
  table_idx: 27
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 5E745DE4
  value: 'Example: ''You are safe here with me, Madge. I am right here to help you.'''
- field_id: CHCAGE011_TXT_28_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Reassuring body language - Description
  table_idx: 28
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 0251CF97
  value: Open arm posture, gentle unhurried movements, and warm eye contact.
- field_id: CHCAGE011_TXT_28_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Reassuring body language - One example
  table_idx: 28
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 1795786C
  value: 'Example: Placing a gentle, reassuring hand on the resident''s arm when they seem anxious.'
- field_id: CHCAGE011_TXT_28_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Validation in the form of acceptance of the person’s reality - Description
  table_idx: 28
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 484C3717
  value: Accepting the person's feelings and their version of reality instead of arguing.
- field_id: CHCAGE011_TXT_28_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Validation in the form of acceptance of the person’s reality - One example
  table_idx: 28
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 2EEA52F6
  value: 'Example: If a resident is worried about getting her children from school, saying: ''You are such a caring mother, tell me about your kids.'''
- field_id: CHCAGE011_TXT_28_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Validation in the form of acknowledgement - Description
  table_idx: 28
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 71D914DB
  value: Recognizing and acknowledging how the person is feeling.
- field_id: CHCAGE011_TXT_28_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Validation in the form of acknowledgement - One example
  table_idx: 28
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 30020E0B
  value: 'Example: ''I can see you are feeling upset and worried right now. I understand.'''
- field_id: CHCAGE011_TXT_28_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Accepting expressions of distress - Description
  table_idx: 28
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 3AAB4861
  value: Letting the person cry or express frustration without shushing them or walking away.
- field_id: CHCAGE011_TXT_28_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Accepting expressions of distress - One example
  table_idx: 28
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: '58049052'
  value: 'Example: Sitting quietly with a crying resident, holding their hand, and offering a tissue.'
- field_id: CHCAGE011_TXT_28_5_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Reminiscence - Description
  table_idx: 28
  row_idx: 5
  col_idx: 1
  index_in_cell: 0
  para_id: 4E556803
  value: Talking about happy past memories, achievements, and family life.
- field_id: CHCAGE011_TXT_28_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Reminiscence - One example
  table_idx: 28
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 3D840AAA
  value: 'Example: Looking through a photo album together and asking about their wedding day or old job.'
