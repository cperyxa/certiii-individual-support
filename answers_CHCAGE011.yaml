- field_id: CHCAGE011_TXT_5_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  prompt: Alzheimer's disease - Describe the following types of dementia.
  table_idx: 5
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 503A0E26
  value: 'Frontotemporal Dementia: Early onset degeneration of frontal and temporal lobes, causing pronounced personality changes, behavioural disinhibition, and aphasia.'
- field_id: CHCAGE011_TXT_5_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  prompt: Vascular dementia - Describe the following types of dementia.
  table_idx: 5
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 47E5A2E8
  value: 'Vascular dementia: Caused by reduced cerebral blood flow due to stroke, arteriosclerosis, or small vessel disease, leading to a stepwise decline in cognitive function, executive planning, and motor coordination.'
- field_id: CHCAGE011_TXT_5_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  prompt: Multi-infarct dementia (a form of vascular dementia) - Describe the following types of dementia.
  table_idx: 5
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 78557F42
  value: 'Multi-infarct dementia: A specific form of vascular dementia caused by multiple successive mini-strokes (transient ischemic attacks) damaging localized areas of brain tissue.'
- field_id: CHCAGE011_TXT_6_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Lewy bodies dementia - Description
  table_idx: 6
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 13DDF173
  value: 'Lewy Body Dementia: Cognitive decline marked by recurrent visual hallucinations, parkinsonian motor symptoms (rigidity, tremor), and marked fluctuations in attention.'
- field_id: CHCAGE011_TXT_6_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Korsakov Syndrome - Description
  table_idx: 6
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 110B3823
  value: 'Korsakoff Syndrome: Severe chronic memory disorder caused by thiamine (Vitamin B1) deficiency, frequently linked to prolonged alcohol abuse, causing anterograde amnesia and confabulation.'
- field_id: CHCAGE011_TXT_6_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Frontotemporal lobar degeneration (FLTD) - Description
  table_idx: 6
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 1F2E051F
  value: 'Frontotemporal lobar degeneration: Atrophy in the frontotemporal cortices resulting in progressive language impairment (primary progressive aphasia) or social conduct deterioration.'
- field_id: CHCAGE011_TXT_6_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Huntington's disease - Description
  table_idx: 6
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 75890EBF
  value: 'Huntington''s disease: An inherited autosomal dominant neurodegenerative genetic disorder causing progressive chorea (involuntary movements), emotional disturbances, and cognitive decline.'
- field_id: CHCAGE011_TXT_6_5_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Parkinson's Disease - Description
  table_idx: 6
  row_idx: 5
  col_idx: 1
  index_in_cell: 0
  para_id: 10A2DBD9
  value: 'Parkinson''s Disease: A neurodegenerative disease characterized by loss of dopamine-producing brain cells, producing tremor, bradykinesia, rigidity, and late-stage dementia with Lewy bodies.'
- field_id: CHCAGE011_TXT_6_6_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Younger onset dementia - Description
  table_idx: 6
  row_idx: 6
  col_idx: 1
  index_in_cell: 0
  para_id: 12CABC9B
  value: 'Younger onset dementia: Dementia diagnosed in individuals under the age of 65, often presenting with significant atypical behavioural or linguistic changes and profound socioeconomic impact.'
- field_id: CHCAGE011_TXT_7_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: Explain how dementia is a progressive neurological condition.
  table_idx: 7
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 2F57BD1E
  value: Amyloid plaques are extracellular deposits composed of misfolded insoluble beta-amyloid peptide aggregates that accumulate between nerve cells.
- field_id: CHCAGE011_TXT_7_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: What are amyloid plaques?
  table_idx: 7
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 7BB84B4D
  value: Plaques disrupt inter-neuronal chemical communication, trigger neuroinflammation, and activate microglial immune responses that damage surrounding synapses.
- field_id: CHCAGE011_TXT_7_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: How do amyloid plaques contribute to the progression of dementia?
  table_idx: 7
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 71DDBDCC
  value: Amyloid plaques accumulate between neurons, disrupting synaptic communication, triggering chronic localized neuroinflammation, and activating microglia that destroy surrounding neural pathways.
- field_id: CHCAGE011_TXT_8_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_8
  prompt: What are neurofibrillary tangles?
  table_idx: 8
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 650B4FC7
  value: Neurofibrillary tangles are abnormal intracellular accumulations of hyperphosphorylated tau protein inside neurons.
- field_id: CHCAGE011_TXT_8_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_8
  prompt: What happens to tau proteins when neurofibrillary tangles occur in people with dementia?
  table_idx: 8
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 14EC1E8B
  value: Neurofibrillary tangles are abnormal intracellular accumulations of hyperphosphorylated tau protein inside neurons.
- field_id: CHCAGE011_TXT_8_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_8
  prompt: How do amyloid plaques and neurofibrillary tangles contribute to the loss of connection between cells to other parts of the body?
  table_idx: 8
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 278798A4
  value: Tau protein detaches from microtubules and tangles into insoluble filaments, causing internal transport systems to collapse and leading to cell death.
- field_id: CHCAGE011_TXT_8_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_8
  prompt: Complete the diagram below by listing the four key events that happen in cell death in people with dementia.
  table_idx: 8
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 17A2AA4E
  value: Progressive cerebral cortex atrophy and ventricular enlargement.
