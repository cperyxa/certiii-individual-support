- field_id: CHCAGE011_TXT_5_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  prompt: Alzheimer's disease - Describe the following types of dementia.
  table_idx: 5
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 503A0E26
  value: 'Frontotemporal Dementia: Affects the front parts of the brain, causing noticeable changes in personality, social behavior, and loss of speech or language understanding.'
- field_id: CHCAGE011_TXT_5_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  prompt: Vascular dementia - Describe the following types of dementia.
  table_idx: 5
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 47E5A2E8
  value: 'Vascular dementia: Caused by poor blood flow in the brain due to strokes, leading to problems with planning, walking, and thinking.'
- field_id: CHCAGE011_TXT_5_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  prompt: Multi-infarct dementia (a form of vascular dementia) - Describe the following types of dementia.
  table_idx: 5
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 78557F42
  value: 'Multi-infarct dementia: A form of vascular dementia caused by multiple small mini-strokes that damage small areas across the brain over time.'
- field_id: CHCAGE011_TXT_6_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Lewy bodies dementia - Description
  table_idx: 6
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 13DDF173
  value: 'Lewy Body Dementia: Causes memory problems along with visual hallucinations, fluctuating alertness, and tremors or stiffness similar to Parkinson''s disease.'
- field_id: CHCAGE011_TXT_6_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Korsakov Syndrome - Description
  table_idx: 6
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 110B3823
  value: 'Korsakoff Syndrome: A severe memory condition caused by a lack of vitamin B1 (thiamine), usually linked to long-term alcohol misuse. It makes it very hard to learn new information.'
- field_id: CHCAGE011_TXT_6_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Frontotemporal lobar degeneration (FLTD) - Description
  table_idx: 6
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 1F2E051F
  value: 'Frontotemporal lobar degeneration: Brain shrinkage in the front and temporal lobes, leading to major changes in social behaviour or difficulty speaking and understanding words.'
- field_id: CHCAGE011_TXT_6_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Huntington's disease - Description
  table_idx: 6
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 75890EBF
  value: 'Huntington''s disease: An inherited genetic condition that causes involuntary jerky movements, mood swings, and gradual loss of thinking and memory skills.'
- field_id: CHCAGE011_TXT_6_5_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Parkinson's Disease - Description
  table_idx: 6
  row_idx: 5
  col_idx: 1
  index_in_cell: 0
  para_id: 10A2DBD9
  value: 'Parkinson''s Disease: A condition affecting brain cells that control movement, leading to shaking, stiff muscles, slow movements, and in later stages, dementia.'
- field_id: CHCAGE011_TXT_6_6_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  prompt: Younger onset dementia - Description
  table_idx: 6
  row_idx: 6
  col_idx: 1
  index_in_cell: 0
  para_id: 12CABC9B
  value: 'Younger onset dementia: Any form of dementia diagnosed in people under the age of 65, which often has a big impact on family, work, and finances.'
- field_id: CHCAGE011_TXT_7_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: Explain how dementia is a progressive neurological condition.
  table_idx: 7
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 2F57BD1E
  value: Amyloid plaques are abnormal protein build-ups that form in the spaces between brain cells.
- field_id: CHCAGE011_TXT_7_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: What are amyloid plaques?
  table_idx: 7
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 7BB84B4D
  value: They block messages from passing between brain cells and trigger inflammation that damages surrounding brain tissue.
- field_id: CHCAGE011_TXT_7_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: How do amyloid plaques contribute to the progression of dementia?
  table_idx: 7
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 71DDBDCC
  value: Plaques build up between brain cells, stopping normal communication and causing nearby nerve cells to weaken and die.
- field_id: CHCAGE011_TXT_8_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_8
  prompt: What are neurofibrillary tangles?
  table_idx: 8
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 650B4FC7
  value: Neurofibrillary tangles are twisted strands of tau protein that form inside brain cells.
- field_id: CHCAGE011_TXT_8_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_8
  prompt: What happens to tau proteins when neurofibrillary tangles occur in people with dementia?
  table_idx: 8
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 14EC1E8B
  value: Neurofibrillary tangles are twisted strands of tau protein that form inside brain cells.
- field_id: CHCAGE011_TXT_8_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_8
  prompt: How do amyloid plaques and neurofibrillary tangles contribute to the loss of connection between cells to other parts of the body?
  table_idx: 8
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 278798A4
  value: Tau protein detaches from the cell structure and tangles up, destroying the transport system inside the brain cell so it cannot survive.
- field_id: CHCAGE011_TXT_8_3_0_1
  type: text
