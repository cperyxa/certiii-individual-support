- field_id: CHCAGE011_TXT_12_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: What are restrictive practices?
  table_idx: 12
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 19B7B418
  value: Restrictive practices are actions or devices that stop a person from moving freely or making their own choices (like locking doors, using bed rails, or giving sedating medications). They should only ever be used as a last resort when there is immediate danger, and for the shortest possible time.
