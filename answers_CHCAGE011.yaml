- field_id: CHCAGE011_TXT_27_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Verbal communication - Description
  table_idx: 27
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 4CFC82E3
  value: Clear, concise speech using simple words, calm tone, and one idea at a time.
- field_id: CHCAGE011_TXT_27_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Verbal communication - One example
  table_idx: 27
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 4B542B06
  value: 'Example: ''Good morning, John. Here is your warm cup of tea.'''
- field_id: CHCAGE011_TXT_27_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Non-verbal communication - Description
  table_idx: 27
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 0FE14E42
  value: Facial expressions, eye contact, relaxed body posture, and reassuring gestures.
- field_id: CHCAGE011_TXT_27_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Non-verbal communication - One example
  table_idx: 27
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 5183FCF6
  value: 'Example: Sitting at eye level, smiling warmly, and nodding gently while the person speaks.'
- field_id: CHCAGE011_TXT_27_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Culturally sensitive communication - Description
  table_idx: 27
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 1A681308
  value: Demonstrating respect for the person's cultural customs, language preferences, and traditions.
- field_id: CHCAGE011_TXT_27_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Culturally sensitive communication - One example
  table_idx: 27
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 25AED88C
  value: 'Example: Addressing an elder with their preferred honorific title and respecting eye contact customs.'
- field_id: CHCAGE011_TXT_27_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Culturally safe communication - Description
  table_idx: 27
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 69FD9121
  value: Creating an environment where the person feels their identity is respected and free from discrimination.
- field_id: CHCAGE011_TXT_27_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Culturally safe communication - One example
  table_idx: 27
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 3FB57BD3
  value: 'Example: Engaging an accredited bilingual carer or interpreter when discussing daily care preferences.'
- field_id: CHCAGE011_TXT_27_5_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Reality orientation - Description
  table_idx: 27
  row_idx: 5
  col_idx: 1
  index_in_cell: 0
  para_id: 56F799A3
  value: Providing gentle current environmental cues (calendars, clocks) when appropriate without causing distress.
- field_id: CHCAGE011_TXT_27_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Reality orientation - One example
  table_idx: 27
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 3D99250A
  value: 'Example: Placing a large-print calendar and wall clock in the resident''s bedroom.'
- field_id: CHCAGE011_TXT_27_6_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Reassuring words and phrases - Description
  table_idx: 27
  row_idx: 6
  col_idx: 1
  index_in_cell: 0
  para_id: 6466FFE8
  value: Using empathetic verbal affirmations that convey safety, care, and comfort.
- field_id: CHCAGE011_TXT_27_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_27
  prompt: Reassuring words and phrases - One example
  table_idx: 27
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 5E745DE4
  value: 'Example: ''You are safe here with me, Arthur. I am right beside you.'''
- field_id: CHCAGE011_TXT_28_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Reassuring body language - Description
  table_idx: 28
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 0251CF97
  value: Open arm posture, warm eye contact, and gentle unhurried movements.
- field_id: CHCAGE011_TXT_28_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Reassuring body language - One example
  table_idx: 28
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 1795786C
  value: 'Example: Resting a reassuring hand gently on the resident''s forearm during a stressful moment.'
- field_id: CHCAGE011_TXT_28_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Validation in the form of acceptance of the person’s reality - Description
  table_idx: 28
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 484C3717
  value: Entering the person's subjective reality rather than correcting or arguing about facts.
- field_id: CHCAGE011_TXT_28_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Validation in the form of acceptance of the person’s reality - One example
  table_idx: 28
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 2EEA52F6
  value: 'Example: If the resident is worried about getting children from school, saying ''You love your children very much; tell me about them.'''
- field_id: CHCAGE011_TXT_28_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Validation in the form of acknowledgement - Description
  table_idx: 28
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 71D914DB
  value: Acknowledging and mirroring the person's underlying emotional state.
- field_id: CHCAGE011_TXT_28_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Validation in the form of acknowledgement - One example
  table_idx: 28
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 30020E0B
  value: 'Example: ''I can see that you are feeling very frustrated right now. I understand.'''
- field_id: CHCAGE011_TXT_28_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Accepting expressions of distress - Description
  table_idx: 28
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 3AAB4861
  value: Allowing the person to express crying, anger, or fear without shushing, judging, or dismissing them.
- field_id: CHCAGE011_TXT_28_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Accepting expressions of distress - One example
  table_idx: 28
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: '58049052'
  value: 'Example: Staying calmly present beside a crying resident and offering a tissue with a quiet presence.'
- field_id: CHCAGE011_TXT_28_5_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Reminiscence - Description
  table_idx: 28
  row_idx: 5
  col_idx: 1
  index_in_cell: 0
  para_id: 4E556803
  value: Engaging the person in pleasant conversations about positive past life events and achievements.
- field_id: CHCAGE011_TXT_28_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_28
  prompt: Reminiscence - One example
  table_idx: 28
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 3D840AAA
  value: 'Example: Reviewing a personalized memory box containing old family photos and a favorite gardening trowel.'
- field_id: CHCAGE011_TXT_29_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: Briefly explain each type of stressor.
  table_idx: 29
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 1D0A5FDB
  value: 'Environmental stressors: External stimuli such as loud alarms, bright fluorescent glare, or crowded rooms that overwhelm sensory processing.'
- field_id: CHCAGE011_TXT_29_2_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: Briefly explain each type of stressor.
  table_idx: 29
  row_idx: 2
  col_idx: 0
  index_in_cell: 1
  para_id: 53CA1CCB
  value: 'Internal physical stressors: Undetected pain, constipation, urinary tract infection, or fatigue producing distress.'
- field_id: CHCAGE011_TXT_29_2_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: Briefly explain each type of stressor.
  table_idx: 29
  row_idx: 2
  col_idx: 0
  index_in_cell: 2
  para_id: 78CCAB6D
  value: 'Psychological stressors: Loss of autonomy, feeling misunderstood, grief, or fear from disorientation.'
- field_id: CHCAGE011_TXT_29_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: Listed below are examples of environmental and accumulated stressors. Briefly describe how each can impact the person living with dementia.
  table_idx: 29
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 42DCE059
  value: Loud dining room noise overwhelms acoustic filtering, leading to agitation and refusal to eat.
- field_id: CHCAGE011_TXT_29_3_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: Listed below are examples of environmental and accumulated stressors. Briefly describe how each can impact the person living with dementia.
  table_idx: 29
  row_idx: 3
  col_idx: 0
  index_in_cell: 1
  para_id: 059C04B9
  value: Accumulated minor frustrations across a morning routine trigger an afternoon catastrophic reaction.
- field_id: CHCAGE011_TXT_29_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  prompt: Describe how cumulative stressors can impact the person living with dementia.
  table_idx: 29
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: '76102397'
  value: Cumulative stressors build up tension until the person reaches a tipping point, resulting in severe agitation, shouting, combativeness, or complete emotional withdrawal.
