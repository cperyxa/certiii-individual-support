- field_id: CHCAGE011_TXT_11_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_11
  prompt: Explain how behaviours can be an indicator of unmet needs in people living with dementia.
  table_idx: 11
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 65708D00
  value: Behaviours are often a way of communicating an unmet need (like pain, hunger, cold, or fear) when the person can no longer explain it in words. For example, a resident pushing staff away during a shower because the water is too hot, or pacing because they have a painful urinary infection.
