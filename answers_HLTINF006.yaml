  col_idx: 0
  index_in_cell: 3
  para_id: 5AC626A8
  value: Train the staff responsible for cleaning equipment on procedures before the
    equipment is placed into use.
- field_id: HLTINF006_TXT_46_4_0_5
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
