  table_idx: 46
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 19AF614A
  value: 'What are noncritical patient care equipment? The candidate must define what
    noncritical patient care equipment are. For a satisfactory performance, the underlined
    words must appear in the candidate’s response: Noncritical patient care equipment
    is used by healthcare workers to touch patients, frequently touched by healthcare
    workers and patients and often shared between patients.'
