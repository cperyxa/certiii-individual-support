  type: text
  section: Knowledge Assessment
  question_ref: Table_37
  label: Table 37 Row 3 Col 0
  table_idx: 37
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 278621FE
  value: Fasten the ties or tapes above and below your ears at the back of your head.
- field_id: HLTINF006_TXT_37_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_37
  label: Table 37 Row 4 Col 0
  table_idx: 37
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 09C7FBF5
  value: Fit flexible band to nose bridge.
- field_id: HLTINF006_TXT_38_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_38
  label: Table 38 Row 2 Col 0
  table_idx: 38
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 6F109831
  value: Using clean hands, untie or break the ties at the back of your head without
    touching the front of the mask.
- field_id: HLTINF006_TXT_38_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_38
  label: Table 38 Row 3 Col 0
  table_idx: 38
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 1A4012FF
  value: Touch only the ties of the mask and discard it into the designated waste
    disposal container.
- field_id: HLTINF006_TXT_38_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_38
  label: Table 38 Row 4 Col 0
  table_idx: 38
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 06B60DF8
  value: Perform hand hygiene immediately after disposal.
- field_id: HLTINF006_TXT_39_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Table 39 Row 2 Col 0
  table_idx: 39
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 3D487165
  value: Perform hand hygiene before putting on gloves.
- field_id: HLTINF006_TXT_39_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Table 39 Row 3 Col 0
  table_idx: 39
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 4BB2AD36
  value: Remove gloves one at a time from the box or packaging, holding the top of
    the cuff.
- field_id: HLTINF006_TXT_39_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Table 39 Row 4 Col 0
  table_idx: 39
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 1564FDCD
  value: Put your hand through the glove opening and pull it up to the wrist.
- field_id: HLTINF006_TXT_39_5_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Table 39 Row 5 Col 0
  table_idx: 39
  row_idx: 5
  col_idx: 0
  index_in_cell: 0
  para_id: '62667122'
  value: Repeat the same procedure with the second hand.
- field_id: HLTINF006_TXT_39_6_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_39
  label: Table 39 Row 6 Col 0
  table_idx: 39
  row_idx: 6
  col_idx: 0
  index_in_cell: 0
  para_id: 0503B6AA
  value: Adjust gloves to cover wrists or gown cuffs as required.
- field_id: HLTINF006_TXT_40_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_40
  label: Table 40 Row 2 Col 0
  table_idx: 40
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 51FAEDD9
  value: Using a gloved hand, grasp the palm area of the other gloved hand and peel
    off the first glove.
- field_id: HLTINF006_TXT_40_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_40
  label: Table 40 Row 3 Col 0
  table_idx: 40
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 0A66588F
  value: Hold the removed glove in the remaining gloved hand.
- field_id: HLTINF006_TXT_40_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_40
  label: Table 40 Row 4 Col 0
  table_idx: 40
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 6EBCAF9E
  value: Slide fingers of ungloved hand under the remaining glove at the wrist and
    peel off the second glove over the first glove.
- field_id: HLTINF006_TXT_40_5_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_40
  label: Table 40 Row 5 Col 0
  table_idx: 40
  row_idx: 5
  col_idx: 0
  index_in_cell: 0
  para_id: 629F8A3F
