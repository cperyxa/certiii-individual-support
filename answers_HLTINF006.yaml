  value: Model answers are provided below for the assessor’s reference.
- field_id: HLTINF006_TXT_44_2_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: List four best practices for environmental cleaning of surfaces.
  table_idx: 44
  row_idx: 2
  col_idx: 0
  index_in_cell: 1
  para_id: 316FBDAF
  value: Use fresh cleaning cloths at the start of each cleaning session (e.g., routine
    daily cleaning in a general inpatient ward).
- field_id: HLTINF006_TXT_44_2_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: List four best practices for environmental cleaning of surfaces.
  table_idx: 44
  row_idx: 2
  col_idx: 0
  index_in_cell: 2
  para_id: 26CCC0E9
  value: Change cleaning cloths when they are no longer saturated with solution, for
    a new, wetted cloth.
- field_id: HLTINF006_TXT_44_2_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: List four best practices for environmental cleaning of surfaces.
  table_idx: 44
  row_idx: 2
  col_idx: 0
  index_in_cell: 3
  para_id: 266421A5
  value: Soiled cloths should be stored for reprocessing. For higher-risk areas, change
    cleaning cloths between each patient zone (i.e., use a new cleaning cloth for
    each patient bed). For example, in a multi-bed intensive unit, use a fresh cloth
    for every bed/incubator.
- field_id: HLTINF006_TXT_44_3_0_1
