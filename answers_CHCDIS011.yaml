- field_id: CHCDIS011_TXT_5_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  prompt: Explain how the theory of Social Role Valorisation (SRV) is related to the social devaluation of people with disability.
  table_idx: 5
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 02C64445
  value: Social Role Valorisation (SRV), developed by Wolf Wolfensberger, posits that people are much less likely to be devalued or abused if they occupy valued social roles (e.g. employee, student, friend, homeowner, artist) within their community.
