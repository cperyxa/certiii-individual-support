- field_id: CHCCCS031_PartA_TXT_6_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Explain what active support is.
  table_idx: 6
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 1A2924DC
  value: Active support is an evidence-based approach that enables people with intellectual
    and physical disabilities to engage meaningfully in daily domestic, recreational,
    and vocational activities at home and in the community, regardless of their level
    of impairment.
- field_id: CHCCCS031_PartA_TXT_6_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: The following are principles underpinning active support. Briefly explain
    what each principle means.
  table_idx: 6
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 3CEF4700
  value: 'Every moment has potential: Using daily routine tasks (cooking, tidying,
    shopping) as opportunities for engagement and learning.'
- field_id: CHCCCS031_PartA_TXT_6_3_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: The following are principles underpinning active support. Briefly explain
    what each principle means.
  table_idx: 6
  row_idx: 3
  col_idx: 0
  index_in_cell: 1
  para_id: 4E422967
  value: 'Little and often: Breaking complex activities down into manageable components
    so the person can participate frequently without fatigue.'
- field_id: CHCCCS031_PartA_TXT_6_3_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: The following are principles underpinning active support. Briefly explain
    what each principle means.
  table_idx: 6
  row_idx: 3
  col_idx: 0
  index_in_cell: 2
  para_id: 180BAAD2
  value: 'Graded assistance: Providing just the right amount of help (verbal prompts,
    modelling, physical guidance) to enable success.'
- field_id: CHCCCS031_PartA_TXT_6_3_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: The following are principles underpinning active support. Briefly explain
    what each principle means.
  table_idx: 6
  row_idx: 3
  col_idx: 0
  index_in_cell: 3
  para_id: 654B0BBE
  value: 'Maximising choice and control: Offering continuous opportunities for the
    person to decide what, when, and how they want to participate.'
