- field_id: CHCCCS031_PartA_TXT_21_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_21
  label: Explain the ethical considerations relating to the use of restrictive practices.
  table_idx: 21
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 1B224EC4
  value: Restrictive practices infringe on fundamental human rights to liberty and
    bodily integrity; ethically, they can only be justified in extreme emergencies
    to prevent imminent severe harm, with intense oversight.
