- field_id: CHCCCS031_PartA_TXT_20_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What are restrictive practices?
  table_idx: 20
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 74BB1F48
  value: Restrictive practices are any intervention or action that has the effect
    of restricting the free movement or liberty of a person with disability or an
    older person.
- field_id: CHCCCS031_PartA_TXT_20_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify five forms of restrictive practices.
  table_idx: 20
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 4BF26ED7
  value: '1. Chemical restraint: Use of medication for the primary purpose of controlling
    or subduing behaviour.'
- field_id: CHCCCS031_PartA_TXT_20_3_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify five forms of restrictive practices.
  table_idx: 20
  row_idx: 3
  col_idx: 0
  index_in_cell: 1
  para_id: 2E9305FF
  value: '2. Mechanical restraint: Use of devices or equipment to prevent, restrict,
    or subdue bodily movement.'
- field_id: CHCCCS031_PartA_TXT_20_3_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify five forms of restrictive practices.
  table_idx: 20
  row_idx: 3
  col_idx: 0
  index_in_cell: 2
  para_id: 5959E3F2
  value: '3. Physical restraint: Use of physical force to prevent, restrict, or subdue
    movement of the person''s body.'
- field_id: CHCCCS031_PartA_TXT_20_3_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify five forms of restrictive practices.
  table_idx: 20
  row_idx: 3
  col_idx: 0
  index_in_cell: 3
  para_id: 688AB2B9
  value: '4. Environmental restraint: Restricting free access to all parts of the
    person''s environment or community.'
- field_id: CHCCCS031_PartA_TXT_20_3_0_5
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify five forms of restrictive practices.
  table_idx: 20
  row_idx: 3
  col_idx: 0
  index_in_cell: 4
  para_id: 2BF74E0E
  value: '5. Seclusion: Sole confinement of a person in a room or physical space at
    any hour from which free exit is denied.'
