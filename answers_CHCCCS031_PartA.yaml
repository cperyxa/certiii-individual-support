- field_id: CHCCCS031_PartA_TXT_33_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: How can assistive technologies help maintain and promote a person’s independence
    in individual suppo
  table_idx: 33
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 6B11D405
  value: Assistive technologies compensate for physical, cognitive, or sensory impairments,
    empowering the client to perform life activities independently without constant
    reliance on care staff.
- field_id: CHCCCS031_PartA_TXT_33_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: How do assistive technologies support the inclusion of individual support
    clients?
  table_idx: 33
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 7707FD48
  value: 1. Client physical and cognitive capability to operate device safely. 2.
    Ergonomic suitability, fit, and home environment space. 3. Maintenance, battery
    charging, and cleaning protocols. 4. Training requirements for client and support
    workers. 5. Cost, funding approval, and ongoing replacement warranty.
- field_id: CHCCCS031_PartA_TXT_33_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: How do assistive technologies support the participation of individual support
    clients?
  table_idx: 33
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 6FCD35BD
  value: By removing physical, sensory, and cognitive barriers, allowing individuals
    to engage actively in social, educational, and domestic activities with autonomy
    and confidence.
- field_id: CHCCCS031_PartA_TXT_34_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_34
  label: Table 34 Row 2 Col 0
  table_idx: 34
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 04E6FFD5
  value: 1. The person's human right to make decisions and experience dignity of risk.
- field_id: CHCCCS031_PartA_TXT_34_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_34
  label: Table 34 Row 3 Col 0
  table_idx: 34
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 3C9B15B3
  value: 2. The likelihood and potential severity of foreseeable harm to the client
    or others.
- field_id: CHCCCS031_PartA_TXT_34_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_34
  label: Table 34 Row 4 Col 0
  table_idx: 34
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 1A5B9B39
  value: 3. Organizational WHS policies, statutory duties of care, and legal liabilities.
- field_id: CHCCCS031_PartA_TXT_34_5_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_34
  label: Table 34 Row 5 Col 0
  table_idx: 34
  row_idx: 5
  col_idx: 0
  index_in_cell: 0
  para_id: 109D5E49
  value: 4. Environmental hazards within the client's home or facility setting.
- field_id: CHCCCS031_PartA_TXT_34_6_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_34
  label: Table 34 Row 6 Col 0
  table_idx: 34
  row_idx: 6
  col_idx: 0
  index_in_cell: 0
  para_id: '51630823'
  value: 5. Available risk mitigation strategies that preserve the client's choice
    while minimizing danger.
- field_id: CHCCCS031_PartA_TXT_35_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_35
  label: "Abuse and neglect - Listed below are examples of risks typical in individual\
    \ support settings. \nProv"
  table_idx: 35
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 1A2D6197
  value: Maintain strict adherence to code of conduct, conduct mandatory abuse reporting
    training, and implement open-door monitoring.
- field_id: CHCCCS031_PartA_TXT_35_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_35
  label: Social rights infringement - Listed below are examples of risks typical in
    individual support settin
  table_idx: 35
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 6D60CA5E
  value: Actively involve clients in all care conferences, respect their cultural/lifestyle
    choices, and uphold dignity of risk.
- field_id: CHCCCS031_PartA_TXT_35_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_35
  label: "Fall risks - Listed below are examples of risks typical in individual support\
    \ settings. \nProvide one"
  table_idx: 35
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 66FA99F4
  value: Ensure clear pathways free of clutter, install grab rails in bathrooms, provide
    adequate lighting, and encourage prescribed mobility aids.
