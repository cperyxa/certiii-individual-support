  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: What must be done when medication is found to be past the expiry date?
  table_idx: 25
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 6AADA4DB
