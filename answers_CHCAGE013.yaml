- field_id: CHCAGE013_TXT_91_0_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_91
  label: Workplace/organisation
  table_idx: 91
  row_idx: 0
  col_idx: 1
  index_in_cell: 0
  para_id: 0182E626
  value: 'The goal of these case studies is to assess your practical knowledge and
    skills relevant to: Recognising signs of abuse and reporting according to organisational
    policies and procedures Completing workplace checklists and reports This assessment
    is divided into six tasks: Scenario 1 – Rose Task 1.1 – Recognise Signs of Abuse
    Task 1.2 – Complete an Abuse Incident Report Form Task 1.3 – Report Signs of Abuse
    to Supervisor Scenario 2 – Amelia Task 2.1 – Recognise Signs of Abuse Task 2.2
    – Complete an Abuse Incident Report Form Task 2.3 – Report Signs of Abuse to Supervisor
    Each task comes with a set of instructions. You must follow and perform these
    instructions while being observed by the assessor. You are required to: Complete
    the tasks within the time allowed, as scheduled in-class roll. Review the information
    provided about CareConnect College, including any documents and simulated resources
    linked in the case study. Review the scenarios provided in this case study. Review
    each question and provide the responses asked for. Record your responses in the
    spaces provided. Resources required for assessment: To complete this assessment,
    you will need access to the following: Simulated organisational documents, policies
