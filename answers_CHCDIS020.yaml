- field_id: CHCDIS020_TXT_11_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Briefly define
  label: Continuous care - Briefly define each term currently used in supporting people
    with disabilities.
  table_idx: 11
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 2818E43B
  value: Care that is on-going, or likely to be on-going, for at least six months.
- field_id: CHCDIS020_TXT_11_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Briefly define
  label: Dressing aids - Briefly define each term currently used in supporting people
    with disabilities.
  table_idx: 11
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 24C7029D
  value: Includes aids that are used to assist in the dressing process such as zip
    pullers, button hooks and tongs for pulling on clothes.
- field_id: CHCDIS020_TXT_11_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Briefly define
  label: Non-core activities - Briefly define each term currently used in supporting
    people with disabilities
  table_idx: 11
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 6D72D0D4
  value: These include cognitive or emotional tasks, health care, meal preparation,
    reading or writing, household chores, property maintenance and transport.
- field_id: CHCDIS020_TXT_11_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Briefly define
  label: Personal activities/tasks - Briefly define each term currently used in supporting
    people with disabi
  table_idx: 11
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 3F6C0970
  value: These include mobility, self-care, communication, health care and cognitive
    or emotional tasks.
- field_id: CHCDIS020_TXT_11_7_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Briefly define
  label: Unmet need - Briefly define each term currently used in supporting people
    with disabilities.
  table_idx: 11
  row_idx: 7
  col_idx: 2
  index_in_cell: 0
  para_id: '55063394'
  value: A person's need for assistance is unmet if they do not receive assistance,
    or require more assistance than is currently being received, for one or more of
    the activities where assistance is needed.
- field_id: CHCDIS020_TXT_12_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Briefly explain the purpose of an individualised plan in disability support.
  table_idx: 12
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 6256E72F
  value: Individualised care plans serve as a guide in providing the appropriate strategies
    to meet the person’s goals and needs.
- field_id: CHCDIS020_TXT_12_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify five key contents of an individualised plan.
  table_idx: 12
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 73A8D112
  value: The person’s basic information (name, history, condition, allergies if any).
- field_id: CHCDIS020_TXT_12_3_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify five key contents of an individualised plan.
  table_idx: 12
