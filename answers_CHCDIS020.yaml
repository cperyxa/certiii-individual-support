  para_id: 70B72559
  value: A person (the discriminator) discriminates against another person (the aggrieved
    person) on the ground of a disability of the aggrieved person if, because of the
    disability, the discriminator treats, or proposes to treat, the aggrieved person
    less favourably than the discriminator would treat a person without the disability
    in circumstances that are not materially different.
