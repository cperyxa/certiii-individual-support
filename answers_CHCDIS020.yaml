- field_id: CHCDIS020_TXT_19_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_19
  label: Lack of knowledge of individual rights as a person with a disability - How
    this risk area leads to a
  table_idx: 19
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 5A9282D0
  value: If PWDs are not aware of their rights, they may allow others to mistreat
    them.
- field_id: CHCDIS020_TXT_19_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_19
  label: Lack of knowledge of individual rights as a person with a disability - Support
    practice
  table_idx: 19
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 4BA5B861
  value: Provide written resources such as books, magazines, and posters to PWDs that
    talk about their rights.
- field_id: CHCDIS020_TXT_19_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_19
  label: 'Lack of training of staff in recognising and reporting abuse - How this
    risk area leads to abuse of '
  table_idx: 19
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 2F09A1BD
  value: If the staff is unfamiliar with the indicators of abuse and reporting processes,
    they may not be able to intervene quickly enough to protect the person or prevent
    the abuse from occurring.
- field_id: CHCDIS020_TXT_19_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_19
  label: Lack of training of staff in recognising and reporting abuse - Support practice
  table_idx: 19
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 3D3D79DD
  value: Participate in training relevant to recognising and reporting signs of abuse
    of PWDs.
- field_id: CHCDIS020_TXT_21_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_21
  label: Poor funding of disability support services - How this issue affects people
    with disabilities in soc
  table_idx: 21
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 245684D6
  value: If there are limited funds for disability support services, PWDs will not
    get the proper assistance they need to achieve a good quality of life as others
    on an equal basis.
- field_id: CHCDIS020_TXT_21_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_21
  label: Poor funding of disability support services - Support practice
  table_idx: 21
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 07119BD1
  value: Search for cost-effective options for disability support services if resources
    are limited.
- field_id: CHCDIS020_TXT_21_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_21
  label: Inadequate protection for people with disabilities - How this issue affects
    people with disabilities
  table_idx: 21
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 5033F2B3
  value: If the current disability laws lack sufficient protection and support for
    PWDs, they will face challenges that hinder access to their rights.
- field_id: CHCDIS020_TXT_21_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_21
  label: Inadequate protection for people with disabilities - Support practice
  table_idx: 21
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 3C9B33EF
  value: Encourage PWDs to speak up on any concerns that they might have regarding
    access to their rights.
- field_id: CHCDIS020_TXT_23_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_23
  label: Physical abuse - Description
  table_idx: 23
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 35F54DB7
  value: These are actions that involve the inappropriate use of physical contact
    or force against a person. Examples of physical abuse are excessive use of physical
    force or restraint by a staff member and threats of physical abuse made to a person
    with a disability by another person.
- field_id: CHCDIS020_TXT_23_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_23
  label: Physical abuse - Support practice
  table_idx: 23
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 5A2A05A5
  value: Ask for the person’s consent before providing disability support services
    that involve physical touch.
- field_id: CHCDIS020_TXT_23_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_23
  label: Emotional abuse - Description
  table_idx: 23
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 16809B45
  value: These are actions or behaviours that reject, isolate, intimidate or frighten
    by threats, or the witnessing of family violence, to the extent that the person’s
    behaviour is disturbed, or their emotional/psychological wellbeing has been, or
    is at risk of being, seriously impaired. Examples of emotional abuse are rejecting,
    isolating, terrorising and ignoring behaviours.
- field_id: CHCDIS020_TXT_23_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_23
  label: Emotional abuse - Support practice
  table_idx: 23
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 22A1016F
  value: Use encouraging words to boost a person’s self-esteem in accomplishing daily
    tasks.
- field_id: CHCDIS020_TXT_23_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_23
  label: Financial abuse - Description
  table_idx: 23
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 51E5F112
  value: This involves misuse of a person’s assets, property, possessions and finances
    without their consent. Examples of financial abuse are theft, fraud, exploitation
    and pressure in relation to assets, property, possessions and finances.
- field_id: CHCDIS020_TXT_23_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_23
  label: Financial abuse - Support practice
  table_idx: 23
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 1D6DD682
  value: Ask the person to keep a daily log of every item they purchase and any bills
    they paid.
- field_id: CHCDIS020_TXT_23_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_23
  label: Sexual abuse - Description
  table_idx: 23
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 4F59414F
  value: This involves actual or attempted unwanted sexual actions that are otherwise
    forced on a person with a disability against their will or without their consent,
    through the use of physical force, intimidation or coercion. Examples of sexual
    abuse are unwanted sexual acts and indecent assault.
- field_id: CHCDIS020_TXT_23_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_23
  label: Sexual abuse - Support practice
  table_idx: 23
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 4EF6F10B
  value: Encourage the person to participate in support groups for sexual abuse survivors.
