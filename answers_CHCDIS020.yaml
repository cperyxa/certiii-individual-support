- field_id: CHCDIS020_TXT_5_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Acquired brain injury (ABI) - Description
  table_idx: 5
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 08A9989C
  value: It is a disorder that causes damage to the brain, changing the way a person
    acts, thinks, communicates, and behaves.
- field_id: CHCDIS020_TXT_5_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Acquired brain injury (ABI) - Functional capacity
  table_idx: 5
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 3C160485
  value: The ability for decision making of a person with ABI will depend on the severity
    of the brain injury they sustained. A person in the early stages of recovery may
    be unable to make decisions due to still being very confused. However, as their
    cognitive and communication skills improve, they may later regain the capacity
    to make some decisions for themselves.
- field_id: CHCDIS020_TXT_5_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Autism spectrum disorder (ASD) - Description
  table_idx: 5
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 6C2A7B09
  value: It is caused by an irregularity of brain development and is usually detected
    in early childhood and lasts throughout a person’s life. It describes a cluster
    of disorders such as Rett's Disorder and Childhood Disintegrative Disorder.
- field_id: CHCDIS020_TXT_5_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Autism spectrum disorder (ASD) - Functional capacity
  table_idx: 5
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 1B091182
  value: The abilities of people with autism vary and can evolve over time. While
    some people with autism can live independently, others have severe disabilities
    and require life-long care and support.
- field_id: CHCDIS020_TXT_5_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Developmental delay - Description
  table_idx: 5
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 5821C750
  value: It is described as when a child takes longer to reach developmental milestones
    than other children.
- field_id: CHCDIS020_TXT_5_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Developmental delay - Functional capacity
  table_idx: 5
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 4057D659
  value: A person with a developmental delay will take longer time to develop new
    skills, and they might learn in slightly different ways from other people.
- field_id: CHCDIS020_TXT_5_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Intellectual disability - Description
  table_idx: 5
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 21FB94D8
  value: It is a developmental disorder characterised by intelligence limitations
    and significant difficulty with daily living skills.
- field_id: CHCDIS020_TXT_5_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Intellectual disability - Functional capacity
  table_idx: 5
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 04B01642
  value: The abilities of people with intellectual disabilities depend on the severity
    of their condition and any other underlying genetic or medical conditions they
    have. Most of them take longer time to learn and experience delays in development.
- field_id: CHCDIS020_TXT_5_5_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Learning disability - Description
  table_idx: 5
  row_idx: 5
  col_idx: 1
  index_in_cell: 0
  para_id: 1573D466
  value: These are disabilities that causes difficulties in learning and processing
    new information. It affects how the brain handles and perceives external stimuli.
- field_id: CHCDIS020_TXT_5_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_5
  label: Learning disability - Functional capacity
  table_idx: 5
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 242BE771
  value: A person with a learning disability will struggle more in one or more areas
    of learning than would be expected for their level of intelligence. They need
    support to help them succeed at school and work.
- field_id: CHCDIS020_TXT_6_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Neurological impairment - Description
  table_idx: 6
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 7CABD87D
  value: It occurs when there is damage to the nervous system, which includes the
    brain and spinal cord.
- field_id: CHCDIS020_TXT_6_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Neurological impairment - Functional capacity
  table_idx: 6
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 1264FBB8
  value: The abilities of people with neurological impairment vary from person to
    person. Most of them requires assistance in remembering things and performing
    daily tasks.
- field_id: CHCDIS020_TXT_6_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Physical disability - Description
  table_idx: 6
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 04DC3075
  value: These are disabilities that may affect, either temporarily or permanently,
    a person’s physical capacity and mobility.
- field_id: CHCDIS020_TXT_6_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Physical disability - Functional capacity
  table_idx: 6
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 24B71189
  value: A person with a physical disability requires physical adjustments to be made
    to their environment before they can function effectively.
- field_id: CHCDIS020_TXT_6_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Sensory disability - Description
  table_idx: 6
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 6BFBBCE2
  value: These are disabilities that affect a person’s ability to see, hear, smell,
    touch, and taste.
- field_id: CHCDIS020_TXT_6_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Sensory disability - Functional capacity
  table_idx: 6
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 55D38C1A
  value: A person with a sensory disability requires assistive equipment or aid to
    assist them in performing daily activities.
- field_id: CHCDIS020_TXT_6_4_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Speech-language disability - Description
  table_idx: 6
  row_idx: 4
  col_idx: 1
  index_in_cell: 0
  para_id: 18370A8A
  value: It includes communication disorders and impairments involving one’s hearing,
    fluency, and ability to articulate words.
- field_id: CHCDIS020_TXT_6_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Speech-language disability - Functional capacity
  table_idx: 6
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 062C4A62
  value: A person with a speech-language delay will take longer time to articulate
    words and become fluent in communicating with other people.
- field_id: CHCDIS020_TXT_7_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Explain the difference between psychosocial disability and mental health.
  table_idx: 7
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 453A85B7
  value: Mental health refers to our overall emotional and psychological wellbeing,
    which everyone has and can fluctuate. Psychosocial disability occurs when a mental
    health condition causes long-term impairments that significantly impact a person's
    ability to participate in daily activities and community life.
