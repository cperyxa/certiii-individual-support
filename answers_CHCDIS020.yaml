    disability.

    Tick the box t'
  table_idx: 7
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 72FCFB3C
  value: Not everyone who has a mental health condition will have a psychosocial disability.
    Some people with mental health conditions may experience challenges related to
    their condition, but this will not affect their ability to concentrate, complete
    tasks, cope with stressful situations, interact with others, manage stress or
    accept constructive feedback.
