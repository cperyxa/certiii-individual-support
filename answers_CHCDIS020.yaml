- field_id: CHCDIS020_TXT_63_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Define accreditation systems in the disability support sector.
  table_idx: 63
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 6511C94B
  value: Accreditation systems are formal quality processes where independent auditors
    assess disability service providers against NDIS Practice Standards to ensure
    quality and safety.
- field_id: CHCDIS020_TXT_63_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Define funding systems in the disability support sector.
  table_idx: 63
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 5EF14940
  value: Funding systems provide financial resources (such as individual NDIS participant
    budgets or government grants) so participants can pay for the supports they need.
- field_id: CHCDIS020_TXT_63_4_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What is the relationship between funding and accreditation systems in the
    disability support sector?
  table_idx: 63
  row_idx: 4
  col_idx: 0
  index_in_cell: 0
  para_id: 7F34298E
  value: Accreditation bodies check registered organisations if they meet recognised
    standards in the disability support sector. Receiving accreditation confirms the
    level of quality the organisation has achieved and entitles organisations to receive
    funds from either government or other organisations.
