- field_id: CHCDIS020_TXT_13_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Briefly explain how a person-centred approach in disability support differs
    from a traditional one.
  table_idx: 13
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 4363F4BF
  value: The person-centred approach in disability focuses on improving the person’s
    overall quality of life based on personal goals and preferences. On the contrary,
    the traditional approach focuses on managing the person’s illness and medical
    condition based on clinical or medical advice.
- field_id: CHCDIS020_TXT_13_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify three benefits of using a person-centred approach in disability
    support.
  table_idx: 13
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 288B8E11
  value: PWDs will generally have an easier time trusting those who apply person-centred
    approaches.
- field_id: CHCDIS020_TXT_13_3_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify three benefits of using a person-centred approach in disability
    support.
  table_idx: 13
  row_idx: 3
  col_idx: 0
  index_in_cell: 1
  para_id: 0CD5E3F7
  value: PWDs will be more compliant with routines, activities, and programs designed
    based on their needs and wants.
- field_id: CHCDIS020_TXT_13_3_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Identify three benefits of using a person-centred approach in disability
    support.
  table_idx: 13
  row_idx: 3
  col_idx: 0
  index_in_cell: 2
  para_id: 1A297DD7
  value: Support workers will not have difficulty creating support strategies or complicated
    care procedures.
- field_id: CHCDIS020_TXT_14_1_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_14
  label: Upholding autonomy - How this approach puts the person in the centre of the
    service
  table_idx: 14
  row_idx: 1
  col_idx: 1
  index_in_cell: 0
  para_id: 28669BFB
  value: This approach enables the person to be in charge of their own life.
- field_id: CHCDIS020_TXT_14_1_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_14
  label: Upholding autonomy - How you can apply this approach as a disability support
    worker
  table_idx: 14
  row_idx: 1
  col_idx: 2
  index_in_cell: 0
  para_id: 1520477B
  value: I can apply this approach by informing the patient of their right to refuse
    service, right to consent, and right to get a second opinion from other doctors.
- field_id: CHCDIS020_TXT_14_2_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_14
  label: Supporting the person to exercise choice - How this approach puts the person
    in the centre of the se
  table_idx: 14
  row_idx: 2
  col_idx: 1
  index_in_cell: 0
  para_id: 55A9BCF5
  value: This approach enables the person to make reasonable life choices.
- field_id: CHCDIS020_TXT_14_2_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_14
  label: Supporting the person to exercise choice - How you can apply this approach
    as a disability support w
  table_idx: 14
  row_idx: 2
  col_idx: 2
  index_in_cell: 0
  para_id: 317BEFA7
  value: I can apply this approach by involving the person in planning and making
    decisions about their care.
- field_id: CHCDIS020_TXT_14_3_1_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_14
  label: Person’s right to self-determination - How this approach puts the person
    in the centre of the servic
  table_idx: 14
  row_idx: 3
  col_idx: 1
  index_in_cell: 0
  para_id: 7DC950EF
  value: This approach allows the person to set their own goals and assist them towards
    reaching these goals.
- field_id: CHCDIS020_TXT_14_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_14
  label: Person’s right to self-determination - How you can apply this approach as
    a disability support worke
  table_idx: 14
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 4B8876F7
  value: I can apply this approach by letting the person give their insights and ideas
    on the kind of assistance they need.
- field_id: CHCDIS020_TXT_15_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Define duty of care as a support practice in disability support.
  table_idx: 15
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 4FBA0DCA
  value: Duty of care means taking reasonable steps as a support worker to ensure
    the safety and wellbeing of the person with disability and prevent foreseeable
    harm.
- field_id: CHCDIS020_TXT_15_3_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What is the relevance of duty of care in disability support?
  table_idx: 15
  row_idx: 3
  col_idx: 0
  index_in_cell: 0
  para_id: 7A4DC2B6
  value: It ensures workers deliver safe, responsible care that protects participants
    from harm while still respecting their right to make choices and take reasonable
    risks.
- field_id: CHCDIS020_TXT_16_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Define dignity of risk in the context of disability support.
  table_idx: 16
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 72105E4A
  value: Dignity of risk means respecting a participant's right to make their own
    choices, try new things, and learn from mistakes, even if there is some risk involved.
- field_id: CHCDIS020_TXT_17_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Which standard
  label: Which standard in the National Standards for Disability Services does the
    dignity of risk align with
  table_idx: 17
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 482A7866
  value: 'Standard 1: Rights'
- field_id: CHCDIS020_TXT_17_0_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Which standard
  label: Which standard in the National Standards for Disability Services does the
    dignity of risk align with
  table_idx: 17
  row_idx: 0
  col_idx: 0
  index_in_cell: 1
  para_id: 789C9ACC
  value: Promotes individual rights to freedom of expression and self-determination.
- field_id: CHCDIS020_TXT_17_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Which standard
  label: What is the disability support worker’s duty of care in relation to dignity
    of risk?
  table_idx: 17
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 370CC63E
  value: It is the disability support worker’s duty of care to ensure that the person
    they are supporting is able to live their lives however they choose while maintaining
    their health and safety (as far as reasonably practicable).
- field_id: CHCDIS020_TXT_17_2_0_1
  type: text
