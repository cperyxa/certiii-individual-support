  section: Knowledge Assessment
  question_ref: Table_33
  label: 'How the requirement is applied in an organisation: - Duty of Care'
  table_idx: 33
  row_idx: 6
  col_idx: 1
  index_in_cell: 0
  para_id: 5FF7708F
  value: The organisation is responsible for making sure that third parties who may
    be sub-contracted, have the equipment they need to meet this requirement. For
    example, a sub-contracted transport service must have a safe and suitable wheelchair
    ramp to access the vehicle if they provide services and supports to consumers
    who use a wheelchair.
- field_id: CHCCCS040_TXT_33_7_1_1
