  section: Knowledge Assessment
  question_ref: Table_33
  label: 'How the requirement is applied in individual practice: - Duty of Care'
  table_idx: 33
  row_idx: 7
  col_idx: 1
  index_in_cell: 0
  para_id: 03015CFE
  value: The individual can describe how the organisation has trained them to safely
    use the equipment. They can also describe any responsibilities they share with
    the consumer for safety, cleanliness and maintenance.
