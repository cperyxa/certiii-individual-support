- field_id: CHCCCS040_TXT_15_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: Identify the two ethical considerations relevant to restrictive practices.
  table_idx: 15
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 62A019C1
  value: 'Identify the two ethical considerations relevant to restrictive practices.
    The candidate must identify the two ethical considerations relevant to restrictive
    practices. For a satisfactory performance, although the wording may slightly vary,
    the candidate’s response must include two of the following: Restrictive practices
    must only be used as a last resort, where the physical and mental integrity of
    the patient is in serious and imminent danger The use of restrictive practices
    must be discontinued if there is a decreasing trend in a patient’s negative behaviour.
    The use of restrictive practices must be based on a consideration of both the
    carer’s duty of care and the patient’s dignity of risk Before considering how
    to deal with difficult symptoms and challenging behaviour, it should be determined
    for whom such symptoms and behaviour are disturbing The restraint of a patient
    who is unable to consent should be permitted only after discussion within a multidisciplinary
    care team and with the relatives, carers and advocates Other responses are acceptable
    provided that they are considerations consistent with typical ethical principles
    or values upheld in the community services and health industry.'
