- field_id: CHCCCS040_TXT_6_3_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Infancy - Describe the human development that happens in each stage of life.
  table_idx: 6
  row_idx: 3
  col_idx: 2
  index_in_cell: 0
  para_id: 6B1DB22C
  value: The child is completely dependent on others during the first stage of life
- field_id: CHCCCS040_TXT_6_4_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Early childhood - Describe the human development that happens in each stage
    of life.
  table_idx: 6
  row_idx: 4
  col_idx: 2
  index_in_cell: 0
  para_id: 4A248BC3
  value: The child’s growing self-control is expressed through climbing, touching,
    exploring etc. They develop a general desire to do things for themselves.
- field_id: CHCCCS040_TXT_6_5_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: School-age - Describe the human development that happens in each stage of
    life.
  table_idx: 6
  row_idx: 5
  col_idx: 2
  index_in_cell: 0
  para_id: 352DBE88
  value: In school, the child begins to learn skills valued by society, and success
    or failure can have a lasting effect on their feelings of adequacy.
- field_id: CHCCCS040_TXT_6_6_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Adolescence - Describe the human development that happens in each stage of
    life.
  table_idx: 6
  row_idx: 6
  col_idx: 2
  index_in_cell: 0
  para_id: 1619CF11
  value: Mental and physical maturation brings with it new feelings, a new body and
    new attitudes.
- field_id: CHCCCS040_TXT_6_7_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Adulthood - Describe the human development that happens in each stage of
    life.
  table_idx: 6
  row_idx: 7
  col_idx: 2
  index_in_cell: 0
  para_id: 3FF71401
  value: The person strives to create or nurture things that will outlast them, generally
    through parenting or contributing positive changes that benefit other people.
- field_id: CHCCCS040_TXT_6_8_2_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_6
  label: Maturity - Describe the human development that happens in each stage of life.
  table_idx: 6
  row_idx: 8
  col_idx: 2
  index_in_cell: 0
  para_id: 516EA129
  value: The person reflects back on the life they have lived and either acquire a
    sense of fulfilment from a life well-lived or a sense of regret over a life misspent.
