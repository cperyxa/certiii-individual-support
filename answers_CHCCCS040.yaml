- field_id: CHCCCS040_TXT_12_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: Describe what constitutes a restrictive practice.
  table_idx: 12
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 3096B3A2
  value: Describe what constitutes a restrictive practice. The candidate must describe
    what constitutes a restrictive practice. For a satisfactory performance, although
    wording may slightly vary, the candidate’s response must be consistent with the
    benchmark answer below. At a minimum, the underlined phrase must appear in the
    candidate’s response. A restrictive practice is any process or intervention that
    limits rights or freedom.
- field_id: CHCCCS040_TXT_13_0_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Table 13 Row 0 Col 0
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 0
  para_id: 61FD7F66
  value: Aged Care Act 1997 / Quality of Care Principles 2014 (Part 4A)
- field_id: CHCCCS040_TXT_13_0_0_2
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Table 13 Row 0 Col 0
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 1
  para_id: 550D4764
  value: Restrictive practices must only be used as a last resort, for the shortest
    possible duration, after exhausting positive behaviour support alternatives. Clinical
    assessment and informed consent from the consumer or substitute decision-maker
    are mandatory.
- field_id: CHCCCS040_TXT_13_0_0_3
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Table 13 Row 0 Col 0
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 2
  para_id: 2635C47D
  value: Part 4A, Quality of Care Principles 2014
- field_id: CHCCCS040_TXT_13_0_0_4
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Table 13 Row 0 Col 0
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 3
  para_id: 77BFC533
  value: Care workers must prioritize non-restrictive interventions, adhere strictly
    to approved behaviour support plans, and maintain constant monitoring and documentation.
- field_id: CHCCCS040_TXT_13_0_0_5
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Table 13 Row 0 Col 0
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 4
  para_id: 2FCD3EE7
  value: National Disability Insurance Scheme (Restrictive Practices and Behaviour
    Support) Rules 2018
- field_id: CHCCCS040_TXT_13_0_0_6
  type: text
  section: Knowledge Assessment
  question_ref: Table_13
  label: Table 13 Row 0 Col 0
  table_idx: 13
  row_idx: 0
  col_idx: 0
  index_in_cell: 5
  para_id: 6FF2EE05
  value: Regulated restrictive practices must be clearly identified, authorised in
    accordance with state/territory legislation, included in a Behaviour Support Plan
    lodged with the NDIS Quality and Safeguards Commission, and subject to regular
    clinical review.
