- field_id: CHCCCS040_TXT_14_1_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Identify
  label: 'What are the seven conditions of registration that service providers must
    meet when using regulated '
  table_idx: 14
  row_idx: 1
  col_idx: 0
  index_in_cell: 0
  para_id: 2D326E11
  value: 'What are the seven conditions of registration that service providers must
    meet when using regulated restrictive practices according to NDIS. The candidate
    must identify the five forms of restrictive practices. For a satisfactory performance,
    although the wording may slightly vary, their response the candidate’s responses
    must be the seven below (in no particular order): A restrictive practice is only
    possible in a behaviour support plan. An NDIS behaviour support practitioner must
    have developed the plan. When using a restrictive practice, it must be the least
    restrictive response possible in the circumstances When using a restrictive practice,
    it must reduce the risk of harm to the person or others When using a restrictive
    practice, it must last for the shortest possible time to ensure the safety of
    the person or others. Where required, the implementing provider must have authorisation.
    The authorisation comes from the State or Territory. The implementing provider
    must follow monthly reporting requirements.'
