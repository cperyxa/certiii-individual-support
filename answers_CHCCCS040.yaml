- field_id: CHCCCS040_TXT_5_2_0_1
  type: text
  section: Knowledge Assessment
  question_ref: Answer the following
  label: What is the concept of self-actualisation?
  table_idx: 5
  row_idx: 2
  col_idx: 0
  index_in_cell: 0
  para_id: 45590C48
  value: What is the concept of self-actualisation? For a satisfactory performance,
    although the wording may slightly vary, the candidate’s responses must be consistent
    with the benchmark answer provided below. Self-actualisation is the inherent desire
    in human beings for self-fulfilment and the motivation to realise one’s own potential
    and possibilities.
